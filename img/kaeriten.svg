  <circle cx="60" cy="130" r="11" fill="#c8412c"/><text x="60" y="135" font-size="14" fill="#fff" text-anchor="middle" font-family="sans-serif" font-weight="700">1</text>
  <circle cx="60" cy="52" r="11" fill="#c8412c"/><text x="60" y="57" font-size="14" fill="#fff" text-anchor="middle" font-family="sans-serif" font-weight="700">2</text>
  <path d="M60 116 C 50 100, 50 84, 58 68" fill="none" stroke="#c8412c" stroke-width="3" stroke-linecap="round" stroke-dasharray="1 6"/>
