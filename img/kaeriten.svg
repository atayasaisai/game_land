  </defs>
  <rect x="44" y="22" width="112" height="156" fill="#fbf5e6" stroke="#b9975b" stroke-width="4"/>
  <rect x="30" y="14" width="18" height="172" rx="9" fill="url(#rod)"/>
  <rect x="152" y="14" width="18" height="172" rx="9" fill="url(#rod)"/>
  <g font-family="Hiragino Mincho ProN,Yu Mincho,serif" font-weight="700" text-anchor="middle">
    <text x="100" y="86" font-size="56" fill="#2b2622">読</text>
    <text x="100" y="156" font-size="56" fill="#2b2622">書</text>
