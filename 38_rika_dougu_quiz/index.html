<script>
(function(){
"use strict";

/* ================= 道具の ファイル =================
   q() は その回の 5問を かえす。問題の 数は あそぶたびに かわる */
var FILES=[
  {id:"tenbin",n:"上皿てんびん",img:"balance",k:"#4CA64C",gr:"小3・小5",d:"分銅を のせて つりあわせ、重さを はかろう",q:qTenbin},
  {id:"mess",n:"メスシリンダー",img:"cylinder",k:"#2F7FD0",gr:"小2・小3・小5",d:"目もりを 読んで、水の かさを はかろう",q:qMess},
  {id:"ondo",n:"温度計",img:"thermo",k:"#E4473B",gr:"小3・小4",d:"目もりを 読んで、温度を はかろう",q:qOndo},
  {id:"hakari",n:"ばねばかり・台ばかり",img:"daibakari",k:"#8A5BD6",gr:"小3",d:"はりの 目もりを 読んで、重さを はかろう",q:qHakari},
  {id:"teko",n:"てこ",img:"lever",k:"#E8A320",gr:"小6",d:"おもりを つるして、てこを つりあわせよう",q:qTeko}
];

/* はかる もの（重さは あそぶたびに この はんいで かわる） */
var ITEMS={
  eraser:{n:"けしゴム",img:"eraser",min:12,max:30,w:54},
  egg:{n:"たまご",img:"egg",min:52,max:68,w:52},
  clay:{n:"ねんど",img:"clay",min:100,max:250,w:66},
  apple:{n:"りんご",img:"apple",min:250,max:380,w:54},
  rock:{n:"石",img:"rock",min:400,max:900,w:64},
  randoseru:{n:"ランドセル",img:"randoseru",min:1050,max:1400,w:62},
  cow:{n:"牛",img:"cow",min:450,max:750,w:124,kg:1}
};

/* ================= 小さな 道具 ================= */
function ri(a,b){return a+Math.floor(Math.random()*(b-a+1));}
function pick(a){return a[Math.floor(Math.random()*a.length)];}
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function takeN(a,n){return shuffle(a).slice(0,n);}
function r1(x){return Math.round(x*10)/10;}
function esc(s){return String(s);}
function fmtG(g){ // 1240 → 1kg 240g
  if(g<1000) return g+"g";
  var k=Math.floor(g/1000),r=g%1000; return k+"kg"+(r?" "+r+"g":"");
}
function fmtC(v){return v<0?"−"+(-v)+"℃":v+"℃";}
/* 正しい数と、まちがえやすい数を まぜて 4つ */
function numChoices(v,steps,lo,hi){
  var s={};s[v]=1;var out=[v];
  steps=shuffle(steps);
  for(var i=0;i<steps.length&&out.length<4;i++){
    var c=r1(v+steps[i]); if(c<lo||c>hi||s[c]) continue; s[c]=1; out.push(c);
  }
  var k=1;while(out.length<4){var c2=r1(v+k*(steps[0]||1));if(!s[c2]&&c2>=lo){s[c2]=1;out.push(c2);}k=k>0?-k:(-k+1);}
  return shuffle(out);
}

/* ================= 1. 上皿てんびん ================= */
var TENBIN_KNOW=[
  {q:"はかる ものは どっちの 皿に のせる？",sub:"（右ききの 人の 場合）",c:["左の 皿","右の 皿","どちらでも よい"],a:0,
   e:"右ききの 人は、何度も 出し入れする <b>分銅を 右の 皿</b>に のせるので、はかる ものは <b>左の 皿</b>に のせるよ。（左ききの 人は ぎゃく）",pic:"balance"},
  {q:"分銅は 何で つかむ？",c:["ピンセット","手で じかに","ゆびで つまむ"],a:0,

/* 台ばかり（先方の 絵の 上に 目もり板を かさねる） */
function daiSVG(o){
  var max=o.max,tick=o.tick,v=o.v,it=ITEMS[o.item];
  var cx=111,cy=143,R=64,s='<svg viewBox="0 -110 258 350" xmlns="'+NS+'">';

  var n=max/tick,labStep=max>1000?200:100;
  for(var i=0;i<n;i++){
    var val=i*tick,a=val/max*2*Math.PI,big=val%labStep===0,mid=!big&&val%(labStep/2)===0;
    var r2=R-(big?10:(mid?7:4)),sx=Math.sin(a),cy_=-Math.cos(a);
    s+='<line x1="'+(cx+sx*R)+'" y1="'+(cy+cy_*R)+'" x2="'+(cx+sx*r2)+'" y2="'+(cy+cy_*r2)+'" stroke="#223" stroke-width="'+(big?1.6:.8)+'"/>';
    if(big){
      var t=val===0?"0":(val===1000?"1kg":(val>1000?String(val-1000):String(val)));
      s+='<text x="'+(cx+sx*(R-19))+'" y="'+(cy+cy_*(R-19)+3.5)+'" font-size="'+(t.length>2?8.5:9.5)+'" font-weight="700" fill="'+(val===1000?"#C0392B":"#223")+'" text-anchor="middle" font-family="sans-serif">'+t+'</text>';

  var ang=v/max*360;

  s+='<circle cx="'+cx+'" cy="'+cy+'" r="5" fill="#D6342A"/>';
  return s+'</svg>';
}

var AC=null;
function tone(fs,dur,type,vol){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state!=="running") AC.resume();
    var t=AC.currentTime;
    fs.forEach(function(f,i){
      var o=AC.createOscillator(),g=AC.createGain();o.type=type||"triangle";o.frequency.value=f;
      g.gain.setValueAtTime(0,t+i*dur);g.gain.linearRampToValueAtTime(vol||.16,t+i*dur+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*dur+dur*1.6);
      o.connect(g);g.connect(AC.destination);o.start(t+i*dur);o.stop(t+i*dur+dur*1.8);
    });
  }catch(e){}
}

  $("work").innerHTML=h;
  var sv=$("lsvg"),ang=0,vel=0,target=0;
  function MR(){var m=0;for(var d=1;d<=6;d++)m+=d*R[d];return m;}
  function count(){var c=0;for(var d=1;d<=6;d++)c+=R[d];return c;}
  function draw(){
    var a=ang*12*Math.PI/180,cx=200,cy=110,s="",U=28;
    s+='<rect x="120" y="262" width="160" height="16" rx="4" fill="#6b7680"/><rect x="194" y="'+(cy)+'" width="12" height="154" fill="#8a949e"/>';
    s+='<path d="M200 '+(cy-6)+' L186 '+(cy+26)+' L214 '+(cy+26)+' Z" fill="#3E7FD0" stroke="#1d4a80" stroke-width="2"/>';
    // うで
    var ca=Math.cos(a),sa=Math.sin(a);
    function P(x){return [cx+x*ca,cy+x*sa];}
    var e1=P(-180),e2=P(180);
    s+='<line x1="'+e1[0]+'" y1="'+e1[1]+'" x2="'+e2[0]+'" y2="'+e2[1]+'" stroke="#C8893E" stroke-width="14" stroke-linecap="round"/>';
    s+='<line x1="'+e1[0]+'" y1="'+(e1[1]-3)+'" x2="'+e2[0]+'" y2="'+(e2[1]-3)+'" stroke="#E7B56E" stroke-width="4" stroke-linecap="round"/>';
    for(var d=1;d<=6;d++){
      [-1,1].forEach(function(sg){
        var p=P(sg*d*U);
        s+='<circle cx="'+p[0]+'" cy="'+p[1]+'" r="3.2" fill="#5b3417"/>';
        s+='<text x="'+p[0]+'" y="'+(p[1]-11)+'" font-size="11" font-weight="700" fill="#5b3417" text-anchor="middle" font-family="sans-serif">'+d+'</text>';
      });
    }
    s+='<circle cx="'+cx+'" cy="'+cy+'" r="6" fill="#fff" stroke="#1d4a80" stroke-width="3"/>';
    function hang(sg,d,n,col){
      var p=P(sg*d*U),y=p[1]+22;
      s+='<line x1="'+p[0]+'" y1="'+p[1]+'" x2="'+p[0]+'" y2="'+y+'" stroke="#555" stroke-width="1.5"/>';
      for(var i=0;i<n;i++){
        s+='<rect x="'+(p[0]-9)+'" y="'+(y+i*17)+'" width="18" height="15" rx="3" fill="'+col+'" stroke="#5b3417" stroke-width="1.2"/>';
      }
    }
    q.L.forEach(function(pq){hang(-1,pq[0],pq[1],"#E8A320");});
    for(var d2=1;d2<=6;d2++) if(R[d2]) hang(1,d2,R[d2],"#9aa4ae");
    s+='<text x="98" y="298" font-size="11" fill="#7A6A58" text-anchor="middle" font-family="sans-serif">1こ ＝ 10g</text>';
    $("ldr").innerHTML=s;
  }
  // タップする ところ（右の うで）。うごく 絵とは べつに 1回だけ かく
  (function(){var hs="";for(var d3=1;d3<=6;d3++){hs+='<rect data-d="'+d3+'" x="'+(200+d3*28-14)+'" y="60" width="28" height="200" fill="transparent" style="cursor:pointer"/>';}$("lhit").innerHTML=hs;})();
  function update(){
    var d=MR()-ML;
    target=d===0?0:Math.max(-1,Math.min(1,d/6));
    var bm=$("bm");
    if(d===0&&count()>0){
      if(q.one&&count()>1){bm.className="balmsg";bm.textContent="つりあったけど… おもりは 1こだけで やってみよう！";return;}
      done=true;bm.className="balmsg ok";bm.textContent="つりあった！";sOk();face("ok");
      var left=q.L.map(function(p){return p[1]+"こ×"+p[0];}).join("＋"),right=[];
      for(var k=1;k<=6;k++) if(R[k]) right.push(R[k]+"こ×"+k);
      setTimeout(function(){judge(true,"",
        "左： "+left+" ＝ <b>"+ML+"</b><br>右： "+right.join("＋")+" ＝ <b>"+ML+"</b><br>（おもりの 数 × 支点からの きょり）が 左右で 同じに なると、てこは つりあうよ。");},900);
    }else{
      bm.className="balmsg";bm.textContent=count()===0?"":(d>0?"右が 下がった（右の はたらきが 大きい）":"左が 下がっている（右が まだ 小さい）");
    }
  }
  sv.addEventListener("click",function(e){
    var t=e.target;if(done||!t.getAttribute||!t.getAttribute("data-d"))return;
    var d=+t.getAttribute("data-d");if(R[d]>=6){say("1か所に つるせるのは 6こまで だよ。");return;}
    R[d]++;sTap();update();
  });
  $("lReset").onclick=function(){if(done)return;R=[0,0,0,0,0,0,0];sTap();update();};
  startAnim(function(dt){
    var acc=(target-ang)*30-vel*5;vel+=acc*dt;ang+=vel*dt;
    if(!document.body.contains(sv)) return false;
    draw();return true;
  });
  update();
}

/* うごきの ループ */
function startAnim(fn){
  stopAnim();var last=0;
  function loop(t){var dt=last?Math.min(.05,(t-last)/1000):0;last=t;if(fn(dt)===false){anim=null;return;}anim=requestAnimationFrame(loop);}
  anim=requestAnimationFrame(loop);
}
function stopAnim(){if(anim){cancelAnimationFrame(anim);anim=null;}}

/* ---------- はんてい ---------- */
function judge(ok,ansText,exp){
  var first=!st.missQ;
  if(!ok){st.miss++;}
  st.res[st.i]=(ok&&first)?1:0;
  paintDots();
  if(ok){sOk();face("ok");}else{sNg();face("why");}
  setTimeout(function(){
    var h='<div class="face">'+img(ok?"marika_ok":"marika_why")+'</div>'
      +'<div class="mark '+(ok?"ok":"ng")+'">'+(ok?"◯":"✕")+'</div>'
      +'<h3 class="'+(ok?"ok":"ng")+'">'+(ok?"せいかい！":"ざんねん…")+'</h3>'
      +(ok||!ansText?'':'<p class="ans">こたえ： '+ansText+'</p>')
      +'<div class="exp">'+exp+'</div>'
      +'<div class="row"><button class="btn go" id="nx">'+(st.i+1<st.qs.length?"つぎへ ▶":"けっかを 見る ▶")+'</button></div>';
    $("ovc").innerHTML=h;$("ov").classList.add("on");
    $("nx").onclick=function(){
      $("ov").classList.remove("on");
      st.i++;
      if(st.i<st.qs.length) showQ(); else finish();
    };
  },ok?450:650);
}

function finish(){
  stopAnim();
  var n=st.miss===0?3:(st.miss<=2?2:1),id=st.f.id,best=REC[id]||0;
  if(n>best){REC[id]=n;save(REC);}
  sClear();
  var msg=n===3?"まちがい なし！ 道具の 使い方は かんぺきだね。":(n===2?"よく できました！ もう一度 やると ★3も ねらえるよ。":"道具の 使い方、もう一度 たしかめてみよう！");
  var h='<div class="face">'+img(n>=2?"marika_ok":"marika_look")+'</div>'
    +'<h3 class="ok">'+st.f.n+' ファイル クリア！</h3>'
    +'<div class="big">'+stars(n)+'</div>'
    +'<div class="exp">'+msg+'<br>まちがい： '+st.miss+'回</div>'
    +'<div class="row"><button class="btn" id="again">もう一度</button><button class="btn go" id="toBoard">ファイルへ ▶</button></div>';
  $("ovc").innerHTML=h;$("ov").classList.add("on");
  var idx=FILES.indexOf(st.f);
  $("again").onclick=function(){$("ov").classList.remove("on");startFile(idx);};
  $("toBoard").onclick=function(){$("ov").classList.remove("on");showTitle();};
}

$("backBtn").onclick=showTitle;
showTitle();
})();
</script>
