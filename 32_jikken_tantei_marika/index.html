<style>
:root{
  --bg0:#F4F8FC;
  --ink:#3A2A18; --sub:#7A6A58; --faint:#A89A88;
  --line:#E3D6C2;
  --panel:#FFFFFF;
  --gold:#E8A320; --ok:#1FA873; --ng:#E0523F; --pick:#F0648E; --step:#2F7FD0;
  color-scheme:light;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
  color:var(--ink);background:var(--bg0);line-height:1.75;overflow-x:hidden;-webkit-font-smoothing:antialiased;
}
#room{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:linear-gradient(180deg,#DDEFFC 0%,#F4F8FC 40%,#FFF7E8 100%);}
#room::after{content:"";position:absolute;inset:0;opacity:.35;
  background-image:linear-gradient(#CFE2F2 1px,transparent 1px),linear-gradient(90deg,#CFE2F2 1px,transparent 1px);background-size:28px 28px}
.wrap{position:relative;z-index:1;max-width:640px;margin:0 auto;padding:0 16px calc(120px + env(safe-area-inset-bottom))}
svg{display:block}
button{font-family:inherit;color:inherit;cursor:pointer}

.btn{border:2px solid var(--line);background:#fff;color:var(--ink);font-weight:700;font-size:1rem;
  padding:12px 22px;border-radius:14px;letter-spacing:.04em;white-space:nowrap;transition:transform .12s,background .2s,border-color .2s}
.btn:hover{background:#FFF8EA}
.btn:active{transform:scale(.96)}
.btn.sm{font-size:.8rem;padding:6px 12px;border-radius:10px;font-weight:500}
.btn.go{font-weight:900;color:#3A2208;border-color:#FFE7A6;
  background:linear-gradient(160deg,#FFE08A,#F2B33D 60%,#E08A1E);box-shadow:0 6px 0 #8A4E0E,0 12px 24px -8px rgba(240,160,40,.7)}
.btn.go:active{transform:translateY(4px);box-shadow:0 2px 0 #8A4E0E}

/* ---------- title ---------- */
#title{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:24px 16px 40px;
  background:#bfe3f5 url(bg.jpg) center 30%/cover no-repeat}
.tlead{display:inline-block;font-size:.72rem;letter-spacing:.2em;border:2.5px solid #33312A;border-radius:999px;padding:3px 15px;
  background:#fff;color:#33312A;box-shadow:3px 3px 0 #33312A;text-decoration:none;font-weight:700}
.tlogo{margin:18px 0 0;line-height:0}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-1.5deg)}50%{transform:translateY(-6px) rotate(1.5deg)}}
.tlogo img{width:min(86vw,400px);height:auto;filter:drop-shadow(0 6px 10px rgba(30,20,10,.35));animation:hop 2.4s ease-in-out infinite}
.tpanel{position:relative;margin-top:34px;width:100%;max-width:640px;display:flex;flex-direction:column;align-items:center;gap:6px;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.35) 0 12px,transparent 12px 24px),linear-gradient(170deg,#FFF6D8,#FFE7A6);
  border:4px solid #5b3417;border-radius:26px;padding:34px 14px 20px;box-shadow:0 8px 0 #5b3417,0 16px 30px rgba(60,35,10,.3);color:var(--ink)}
.tlabel{position:absolute;left:50%;top:-22px;transform:translateX(-50%) rotate(-2deg);white-space:nowrap;
  background:#D6342A;color:#fff;font-family:"Mochiy Pop One",sans-serif;font-size:clamp(1.05rem,4.8vw,1.35rem);letter-spacing:.06em;
  padding:6px 20px;border-radius:12px;border:3px solid #5b3417;box-shadow:0 4px 0 #5b3417}
.intro{display:flex;align-items:flex-end;gap:10px;width:100%;max-width:560px}
.intro img{width:96px;height:auto;flex:none}
.intro .bubble{font-size:.9rem;padding:10px 14px;text-align:left}
.intro .bubble b{color:#C0392B}
.intro .bubble .big{display:block;font-family:"Mochiy Pop One",sans-serif;font-size:clamp(1.05rem,4.4vw,1.3rem);color:#3A1E08;line-height:1.4;margin-bottom:4px;word-break:keep-all}
.prog{margin:10px 0 2px;font-weight:900;color:#5b3417;font-size:.9rem}
.prog b{font-family:"Mochiy Pop One",sans-serif;font-weight:400;font-size:1.3rem;color:#D6342A}
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:18px 12px;margin-top:14px;width:100%}
.file{position:relative;display:flex;align-items:center;gap:12px;text-align:left;width:100%;padding:16px 12px 12px;margin-top:10px;
  border:3px solid #5b3417;border-radius:4px 16px 16px 16px;background:linear-gradient(170deg,#FFFDF6,#FFF1CC);color:var(--ink);
  box-shadow:0 5px 0 #5b3417;transition:transform .12s,box-shadow .12s}
.file::before{content:attr(data-case);position:absolute;left:-3px;top:-22px;padding:0 12px;height:22px;line-height:19px;border:3px solid #5b3417;border-bottom:0;
  border-radius:10px 10px 0 0;background:#FFF1CC;font-family:"Mochiy Pop One",sans-serif;font-size:.72rem;color:#8d5528;letter-spacing:.08em}
.file:hover{transform:translateY(-3px);box-shadow:0 8px 0 #5b3417}
.file:active{transform:translateY(3px);box-shadow:0 2px 0 #5b3417}
.file .n{flex:none;width:46px;height:46px;border-radius:50%;display:grid;place-items:center;background:var(--k,#2F7FD0);color:#fff;
  font-family:"Mochiy Pop One",sans-serif;font-size:1.35rem;border:3px solid #5b3417;box-shadow:0 3px 0 #5b3417}
.file b{display:block;font-family:"Mochiy Pop One",sans-serif;font-weight:400;font-size:1.08rem;line-height:1.35;color:#3A1E08;word-break:keep-all}
.file small{display:block;font-size:.68rem;color:var(--sub);line-height:1.45;margin-top:3px}
.file .rec{position:absolute;right:10px;top:-19px;color:#E8A320;font-size:.95rem;white-space:nowrap;text-shadow:0 1px 0 #5b3417}
.file .rec i{color:#E3D6C2;font-style:normal;text-shadow:none}
.file .stp{position:absolute;right:8px;bottom:6px;transform:rotate(-12deg);border:3px solid #D6342A;color:#D6342A;border-radius:8px;
  font-family:"Mochiy Pop One",sans-serif;font-size:.8rem;padding:0 6px;opacity:.85;background:rgba(255,255,255,.6)}
.file.done{background:linear-gradient(170deg,#F4FFF4,#DDF5DD)}
.file.done::before{background:#DDF5DD}
.backlink{display:inline-block;margin-top:20px;font-size:.84rem;font-weight:700;color:#5b3417;text-decoration:none;border:2px solid #5b3417;border-radius:999px;padding:6px 18px;background:#fff}
.backlink:hover{background:#FFF1CC}

/* ---------- じけん ---------- */
#play{display:none;padding-top:12px}
.hud{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.hud h2{font-size:.95rem;margin:0;font-weight:900;letter-spacing:.06em;flex:1;line-height:1.4}
.hud h2 small{display:block;font-size:.66rem;color:var(--sub);font-weight:500;letter-spacing:.1em}
.mission{position:relative;margin:18px 0 14px;padding:52px 16px 14px;border-radius:22px;border:4px solid #5b3417;
  background:repeating-linear-gradient(135deg,rgba(255,255,255,.18) 0 12px,transparent 12px 24px),linear-gradient(160deg,#FFE9A8,#FFD166 60%,#F6B93B);
  box-shadow:0 7px 0 #5b3417,0 14px 26px rgba(90,50,10,.25)}
.mission.in{animation:stamp .55s cubic-bezier(.2,1.6,.4,1)}
@keyframes stamp{0%{transform:scale(1.25) rotate(-3deg);opacity:0}60%{opacity:1}100%{transform:none}}
.mlabel{position:absolute;left:50%;top:-20px;transform:translateX(-50%) rotate(-2deg);white-space:nowrap;display:flex;align-items:center;gap:6px;
  background:#D6342A;color:#fff;font-family:"Mochiy Pop One",sans-serif;font-size:clamp(1rem,4.6vw,1.3rem);letter-spacing:.06em;
  padding:6px 18px;border-radius:12px;border:3px solid #5b3417;box-shadow:0 4px 0 #5b3417}
.mission.in .mlabel{animation:wob .9s .35s ease}
@keyframes wob{0%,100%{transform:translateX(-50%) rotate(-2deg)}30%{transform:translateX(-50%) rotate(4deg) scale(1.08)}60%{transform:translateX(-50%) rotate(-5deg)}}
.mlabel .mno{font-size:.7em;background:#fff;color:#D6342A;border-radius:999px;padding:0 8px;margin-left:4px}
.mq{margin:6px 0 12px;text-align:center;font-family:"Mochiy Pop One",sans-serif;font-weight:400;line-height:1.45;
  font-size:clamp(1.3rem,5.6vw,1.9rem);color:#3A1E08;text-wrap:balance;word-break:keep-all;overflow-wrap:anywhere;
  text-shadow:2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,0 2px 0 #fff,2px 0 0 #fff,0 -2px 0 #fff,-2px 0 0 #fff}
.mfoot{display:flex;gap:10px;align-items:flex-end}
.mission .face{flex:none;width:84px}
.mission .face img,.ovc .face img{width:100%;height:auto;display:block}
.bubble{position:relative;flex:1;background:#FFFDF6;color:#3A2A18;border-radius:16px;padding:8px 12px;font-size:.84rem;border:3px solid #5b3417;line-height:1.6}
.bubble::before{content:"";position:absolute;left:-12px;bottom:16px;border:8px solid transparent;border-right-color:#5b3417}
.bubble .who{font-size:.68rem;font-weight:900;color:#8d5528;letter-spacing:.1em}
.bubble .q{display:block;margin-top:6px;font-weight:900;font-size:1.02rem;color:#B0341E;line-height:1.5}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:12px;margin-bottom:12px;box-shadow:0 3px 0 #EADFCC}
.card h3{display:flex;align-items:center;gap:8px;font-size:.98rem;letter-spacing:.04em;color:var(--ink);margin:0 0 10px;font-weight:900;line-height:1.4}
.card h3 .no{flex:none;width:30px;height:30px;border-radius:50%;background:var(--step);color:#fff;display:grid;place-items:center;font-family:"Mochiy Pop One",sans-serif;font-weight:400;font-size:1rem}
.card h3 img{height:34px;width:auto}
.card h3 .tn{color:var(--step)}
.card.wait{opacity:.55}
.card.wait .sus{pointer-events:none;filter:grayscale(.6)}
.card.now{border-color:var(--step);box-shadow:0 0 0 4px rgba(47,127,208,.15),0 3px 0 #EADFCC}
.waitmsg{display:none;text-align:center;font-weight:900;color:var(--step);margin:-2px 0 8px;font-size:.9rem}
.card.wait .waitmsg{display:block}
.stage{display:grid;grid-template-columns:minmax(0,1fr);gap:6px}
.stage svg{width:100%;max-width:380px;margin:0 auto;border-radius:14px;background:linear-gradient(#EAF4FC,#F7FBFF 70%,#EFE6D6 70%,#E9DDC8)}
.res{min-height:3.2em;font-size:.92rem;text-align:center;text-wrap:balance}
.res b{color:#C0392B}
.res .na{color:var(--sub)}
.tools{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:8px}
.tool{position:relative;display:flex;flex-direction:column;align-items:center;gap:0;padding:10px 4px 8px;border-radius:14px;border:3px solid var(--line);
  background:#FFFDF8;font-size:.8rem;font-weight:900;line-height:1.35;transition:.15s;box-shadow:0 4px 0 #E3D6C2}
.tool img{height:48px;width:auto;max-width:64px;object-fit:contain;margin-bottom:2px}
.tool:hover{border-color:#C9B593;transform:translateY(-2px)}
.tool.on{border-color:var(--step);background:#E6F2FD;box-shadow:0 4px 0 var(--step);transform:translateY(-2px)}
.tool.on::after{content:"✔ これで しらべる";position:absolute;top:-11px;left:50%;transform:translateX(-50%);white-space:nowrap;
  background:var(--step);color:#fff;font-size:.62rem;padding:0 8px;border-radius:999px;line-height:1.7}
.sus{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.s{position:relative;display:flex;flex-direction:column;border-radius:16px;border:3px solid var(--line);background:#FFFDF8;overflow:hidden;transition:.15s;box-shadow:0 4px 0 #E3D6C2}
.s:hover{border-color:#C9B593}
.s.picked{border-color:var(--pick);box-shadow:0 4px 0 var(--pick)}
.s .look{display:flex;flex-direction:column;align-items:center;padding:8px 6px 4px;background:none;border:0;width:100%}
.s .look svg{width:78px;height:78px}
.s .look b{font-size:.84rem;line-height:1.35;text-align:center;min-height:2.7em;display:flex;align-items:center}
.s .evs{display:flex;flex-wrap:wrap;gap:3px;justify-content:center;padding:0 6px 6px;min-height:8px}
.ev{font-size:.68rem;line-height:1.6;padding:0 7px;border-radius:999px;background:#EFE8DC;color:var(--sub);font-weight:700}
.ev.hit{background:#FFE7A6;color:#7A4A00}
.s .pk{border:0;border-top:2px dashed var(--line);background:#FBF6EC;font-size:.8rem;font-weight:900;padding:8px 0;color:var(--sub)}
.s.picked .pk{background:var(--pick);color:#fff;border-top-style:solid;border-top-color:var(--pick)}
.flash{animation:fl .5s ease}
@keyframes fl{0%{transform:scale(.97)}50%{transform:scale(1.03)}100%{transform:none}}
.help{font-size:.76rem;color:var(--sub);margin:4px 0 0;text-align:center}

.board{position:fixed;left:0;right:0;bottom:0;z-index:5;background:linear-gradient(180deg,rgba(255,249,238,0),rgba(255,249,238,.97) 22%);padding:22px 16px calc(12px + env(safe-area-inset-bottom))}
.board .in{max-width:640px;margin:0 auto;display:flex;align-items:center;gap:10px}
.board .sum{flex:1;font-size:.76rem;line-height:1.5;color:var(--sub);min-width:0}
.board .sum b{color:var(--ink)}
.board .btn.go{font-size:1.05rem;padding:13px 16px}
.board .sum img{height:22px;width:auto;vertical-align:-5px;margin-right:2px}

/* ---------- はんてい ---------- */
.ov{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:16px;background:rgba(40,30,20,.45)}
.ov.on{display:flex}
.ovc{width:100%;max-width:420px;max-height:92dvh;overflow:auto;text-align:center;background:#FFFDF8;border:3px solid #5b3417;box-shadow:0 8px 0 #5b3417;border-radius:24px;padding:20px 18px;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.94);opacity:0}to{transform:none;opacity:1}}
.ovc .face{width:130px;margin:0 auto}
.ovc h3{margin:4px 0;font-size:1.3rem;font-family:"Mochiy Pop One",sans-serif;font-weight:400}
.ovc h3.ok{color:var(--ok)} .ovc h3.ng{color:var(--ng)}
.ovc .big{font-size:2rem;color:#ffd43b;letter-spacing:.1em}
.ovc .big i{color:#E3D6C2;font-style:normal}
.ovc p{font-size:.9rem;margin:6px 0;text-align:left}
.ovc .exp{background:#FFF6E0;border:1px solid var(--line);border-radius:14px;padding:10px 12px;margin:10px 0;text-align:left;font-size:.86rem}
.ovc .exp b{color:#C0392B}
.ovc .stage{margin:4px 0 6px}
.ovc .rh{font-family:"Mochiy Pop One",sans-serif;font-size:1.05rem;color:var(--step);margin:0 0 6px}
.ovc .grade{font-size:.7rem;color:var(--sub);margin-top:4px}
.ovc .row{display:flex;gap:8px;margin-top:12px}
.ovc .row .btn{flex:1}
</style>

<!-- ================= TITLE ================= -->
<section id="title">
  <a class="tlead" href="../">◀ あたやさいさいゲームランド</a>
  <h1 class="tlogo"><img src="art/title.png" alt="実験探偵まりか" width="362" height="300"></h1>

  <div class="tpanel">
  <div class="tlabel">🔍 じけんファイル</div>
  <div class="intro"><img src="art/marika_look.png" alt="">
    <div class="bubble"><span class="who">探偵まりか</span><span class="big">なぞを とく 決め手は 理科の 実験！</span>
    道具と 薬品を えらんで しらべ、わかったら「<b>これが答えだ！</b>」を おしてね。</div></div>
  <p class="prog" id="prog"></p>
  <div class="files" id="files"></div>
  <p style="font-size:.72rem;color:var(--sub);margin-top:14px">小学3年〜6年の 理科の 実験から</p>
  <a class="backlink" href="../">◀ あたやさいさいゲームランドへ もどる</a>
  </div>
</section>

<!-- ================= じけん ================= -->
<section id="play"><div class="wrap">
  <div class="hud">
    <button class="btn sm" id="backBtn">◀ ファイル</button>
    <h2 id="cTitle"></h2>
  </div>

  <div class="mission" id="mission">
    <div class="mlabel"><span class="mic">🔍</span>今回の ミッション<span class="mno" id="mNo"></span></div>
    <p class="mq" id="mQ"></p>
    <div class="mfoot">
      <div class="face" id="mFace"></div>
      <div class="bubble"><span class="who">探偵まりか</span><div id="mStory"></div></div>
    </div>
  </div>

  <div class="card" id="c1">
    <h3><span class="no">1</span>しらべる 道具を 1つ えらぼう</h3>

  </div>

  <div class="card" id="c2">
    <h3 id="h2"></h3>
    <p class="waitmsg">↑ さきに ① で 道具を えらんでね</p>
    <div class="sus" id="sus"></div>
    <p class="help">犯人だと 思ったら、下の「これだ？」を おそう。<br>道具を かえて、何度でも しらべられるよ。</p>
  </div>
</div></section>

<div class="board" id="board" style="display:none"><div class="in">
  <div class="sum" id="sum"></div>
  <button class="btn go" id="answerBtn">これが答えだ！</button>
</div></div>

<div class="ov" id="ov"><div class="ovc" id="ovc"></div></div>

<script>
(function(){
"use strict";

/* ================= 道具・薬品 =================
   what = その道具で わかること（まちがえた決め手を えらんだときに まりかが 教える） */
var TOOLS={
  loupe :{n:"虫めがね",em:"🔍",im:"loupe",what:"見た目を くわしく 見る 道具。見た目だけでは 決め手に ならないことが 多いよ"},
  iodine:{n:"ヨウ素液",em:"🟤",im:"bottle_brown",what:"でんぷんが あると 青むらさき色に かわる 薬品"},
  litmus:{n:"リトマス紙",em:"📄",im:"litmus",what:"酸性だと 青→赤、アルカリ性だと 赤→青に かわる 紙"},
  lime  :{n:"石灰水",em:"🥛",im:"bottle_clear",what:"二酸化炭素に ふれると 白く にごる 水よう液"},
  heat  :{n:"蒸発皿と 火",em:"🔥",im:"lamp",what:"水を 蒸発させて、とけていた ものが 残るかを 見る 実験"},
  circuit:{n:"豆電球と かん電池",em:"💡",im:"bulb",what:"電気を 通す ものを つなぐと 明かりが つく 回路"},
  magnet:{n:"じしゃく",em:"🧲",im:"magnet",what:"鉄を 引きつける。電気を 通すかどうかは わからない"},
  candle:{n:"火のついた ろうそく",em:"🕯️",im:"candle_mid",what:"気体に ものを もやす はたらきが あるかを 見る"},
  smell :{n:"手で あおいで におう",em:"👃",im:"smell",what:"においで 見分ける。においが あっても 酸性か アルカリ性かは わからない"}

/* 試験管だけは 絵が まだ ないので 自作の まま */

    '<path d="M42 44 H58 V78 Q58 90 50 90 Q42 90 42 78 Z" fill="'+liq+'"/><path d="M36 10 H64" '+S+' stroke-linecap="round"/>';

var PURPLE="#3B2468", BROWN="#C9893B";

var SPOT={potato:[72,58],rice:[50,38],bread:[46,46],cucumber:[50,50],egg:[30,62],sugar:[50,36]};

function drawObj(o,fx){
  var k=o.k, g;

    g=img("beaker",0,0,100,100);

    if(o===OBJ.soda) g+='<g fill="#fff" opacity=".9"><circle cx="30" cy="80" r="2.5"/><circle cx="46" cy="66" r="2"/><circle cx="58" cy="84" r="2.5"/><circle cx="66" cy="60" r="1.8"/><circle cx="38" cy="58" r="1.6"/></g>';

  var at=function(x,y,s,inner){return '<g transform="translate('+x+' '+y+') scale('+s+')">'+inner+'</g>';};
  var body="", obj=drawObj(o,(tl==="heat")?"":fx);
  if(!tl){body=at(100,35,1,drawObj(o,""));}
  else if(r&&r.na){body=at(60,40,.95,drawObj(o,""))+'<text x="210" y="112" text-anchor="middle" font-size="64" fill="#6E685E" font-weight="900">？</text>';}
  else switch(tl){
  case "loupe":
    body=at(70,35,1,obj)+img("loupe",135,22,84,126);break;
  case "iodine":
    body=at(95,55,1,obj)+img("dropper",150,0,46,70);break;
  case "litmus":
    var L=fx==="base"?"litmus_b":"litmus_r", Rn=fx==="acid"?"litmus_r":"litmus_b";
    body=at(25,45,1,obj)+'<path d="M128 60 L100 120" stroke="rgba(220,240,255,.8)" stroke-width="5" stroke-linecap="round"/>'+
      img(L,165,30,34,82)+img(Rn,220,30,34,82)+
      '<text x="182" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="'+(fx==="base"?"#F2C14E":"#B4AC9C")+'">'+(fx==="base"?"赤→青":"赤い紙")+'</text>'+
      '<text x="237" y="132" text-anchor="middle" font-size="13" font-weight="700" fill="'+(fx==="acid"?"#F2C14E":"#B4AC9C")+'">'+(fx==="acid"?"青→赤":"青い紙")+'</text>';break;
  case "lime":
    body=img("bottle_clear",25,40,56,80)+at(110,45,1,obj)+'<text x="53" y="138" text-anchor="middle" font-size="12" fill="#B4AC9C">石灰水</text>';break;
  case "heat":
    var dn=fx==="residue"?"dish_salt":"dish_empty";
    body=at(4,74,.55,drawObj(o,""))+img("tripod",100,46,110,118)+img("lamp",134,98,42,62)+img(dn,112,10,86,62)+
      (fx==="burn"?'<ellipse cx="155" cy="44" rx="16" ry="6" fill="#1B1410"/><path d="M155 30 q-8 -10 0 -20 q8 -10 0 -18" stroke="#8C95A0" stroke-width="3" fill="none" opacity=".7"/>':"");break;
  case "circuit":
    var lit=fx==="on";
    body='<path d="M48 64 V28 H104 V82" stroke="#E4473B" stroke-width="3.5" fill="none"/><path d="M196 82 H250 V96" stroke="#E4473B" stroke-width="3.5" fill="none"/>'+
      '<path d="M250 100 V156 H48 V132" stroke="#3B3B3B" stroke-width="3.5" fill="none"/>'+
      img("battery",26,60,44,74)+at(110,38,.86,obj)+
      '<circle cx="104" cy="82" r="4" fill="#D9A635"/><circle cx="196" cy="82" r="4" fill="#D9A635"/>'+
      img(lit?"bulb_on":"bulb_off",214,24,72,76,"xMidYMax");break;
  case "magnet":
    var up=fx==="stick";
    body=img("magnet",118,0,64,60)+at(105,up?52:74,.9,obj)+
      (up?'<path d="M104 58 l-10 -6 M196 58 l10 -6" stroke="#F2C14E" stroke-width="3" stroke-linecap="round"/>':"");break;
  case "candle":
    var cn={big:"candle_big",mid:"candle_mid",short:"candle_mid",out:"candle_out"}[fx]||"candle_mid";
    body='<path d="M150 0 V140" stroke="#8C95A0" stroke-width="3.5"/>'+img("jar",95,10,110,150)+
      '<g'+(fx==="short"?' opacity=".75"':'')+'>'+img(cn,126,60,48,82,"xMidYMax")+'</g>'+
      (fx==="big"?'<circle cx="150" cy="80" r="42" fill="#FFE08A" opacity=".18"/>':"");break;
  case "smell":
    var sm=fx==="smell";
    body=at(40,50,1,obj)+img("smell",160,34,130,120)+
      '<path d="M148 70 q8 -6 16 0 M148 86 q8 -6 16 0 M148 102 q8 -6 16 0" stroke="#B4AC9C" stroke-width="2.5" fill="none"/>'+
      (sm?'<text x="225" y="28" text-anchor="middle" font-size="20" font-weight="900" fill="#F2C14E">つーん！</text>':'');break;
  }
  return '<svg viewBox="0 0 300 170" role="img" aria-label="じっけんの ようす">'+body+'</svg>';
}

/* ================= まりかの 顔 ================= */
function marika(mood){
  var n={ok:"marika_ok",ng:"marika_why"}[mood]||"marika_look";
  return '<img src="art/'+n+'.png" alt="">';
}

/* ================= 音 ================= */
var AC=null;
function tone(fs,dur,type){
  try{
    if(!AC) AC=new (window.AudioContext||window.webkitAudioContext)();
    if(AC.state!=="running") AC.resume();
    var t=AC.currentTime;
    fs.forEach(function(f,i){
      var o=AC.createOscillator(),g=AC.createGain();o.type=type||"triangle";o.frequency.value=f;
      g.gain.setValueAtTime(0,t+i*dur);g.gain.linearRampToValueAtTime(.16,t+i*dur+.02);g.gain.exponentialRampToValueAtTime(.001,t+i*dur+dur*1.6);
      o.connect(g);g.connect(AC.destination);o.start(t+i*dur);o.stop(t+i*dur+dur*1.8);
    });
  }catch(e){}
}

/* ================= 記録 ================= */
var RKEY="jikken_tantei_rec";
function load(){try{var v=localStorage.getItem(RKEY);return v?JSON.parse(v):{};}catch(e){return {};}}
function save(v){try{localStorage.setItem(RKEY,JSON.stringify(v));}catch(e){}}
var REC=load();

/* ================= 画面 ================= */
var $=function(id){return document.getElementById(id);};
var st=null;

var FCOL=["#E4473B","#2F7FD0","#E8A320","#1FA873","#8A5BD6","#E0703A","#3AA0C0","#4CA64C","#D94F8C"];
function paintFiles(){
  var done=0;
  $("files").innerHTML=CASES.map(function(c,i){
    var s=REC[i]||0; if(s) done++;
    return '<button class="file'+(s?" done":"")+'" data-i="'+i+'" data-case="CASE '+(i<9?"0":"")+(i+1)+'" style="--k:'+FCOL[i%FCOL.length]+'"><span class="n">'+(i+1)+'</span><span><b>'+c.t+'</b><small>'+c.g+'</small></span>'+
      '<span class="rec">'+"★".repeat(s)+"<i>"+"★".repeat(3-s)+"</i></span>"+(s?'<span class="stp">かいけつ</span>':"")+'</button>';
  }).join("");
  $("prog").innerHTML='かいけつした じけん　<b>'+done+'</b> ／ '+CASES.length;
}
$("files").addEventListener("click",function(e){var b=e.target.closest(".file");if(b) start(+b.dataset.i);});

function start(i){
  var c=CASES[i];
  st={i:i,c:c,tool:null,ev:{},pick:[],miss:0,last:null};
  $("title").style.display="none";$("play").style.display="block";$("board").style.display="block";
  $("cTitle").innerHTML='<small>じけんファイル '+(i+1)+' ／ '+CASES.length+'</small>'+c.t;
  $("mFace").innerHTML=marika("");
  $("mStory").textContent=c.story;$("mQ").textContent=c.q;$("mNo").textContent="No."+(i+1);
  var m=$("mission");m.classList.remove("in");void m.offsetWidth;m.classList.add("in");
  if(i===st.i) tone([392,523,659],.09);
  $("tools").innerHTML=c.tools.map(function(t){var T=TOOLS[t];return '<button class="tool" data-t="'+t+'"><img src="art/'+T.im+'.png" alt="">'+T.n+'</button>';}).join("");
  paintStep();paintSus();paintSum();window.scrollTo(0,0);
}
function paintSus(){
  var c=st.c;
  $("sus").innerHTML=c.sus.map(function(id){
    var o=OBJ[id], ev=st.ev[id]||{}, chips="";
    c.tools.forEach(function(t){var r=ev[t];if(r&&t!=="loupe") chips+='<span class="ev'+(r.hit?" hit":"")+'">'+TOOLS[t].em+' '+r.short+'</span>';});
    var pk=st.pick.indexOf(id)>=0;
    return '<div class="s'+(pk?" picked":"")+'" data-id="'+id+'"><button class="look" data-act="test">'+iconSVG(o)+'<b>'+o.n+'</b></button><div class="evs">'+chips+'</div>'+
      '<button class="pk" data-act="pick">'+(pk?"🔍 これだ！":"これだ？")+'</button></div>';
  }).join("");
}
function paintStep(){
  var T=st.tool&&TOOLS[st.tool];
  $("c1").classList.toggle("now",!T);
  $("c2").classList.toggle("wait",!T);$("c2").classList.toggle("now",!!T);
  $("h2").innerHTML='<span class="no">2</span>'+(T?'<img src="art/'+T.im+'.png" alt=""><span><span class="tn">'+T.n+'</span>で しらべる ものを タップ！</span>':'しらべる ものを タップ');
}
function paintSum(){
  var c=st.c;
  var t=st.tool?'<img src="art/'+TOOLS[st.tool].im+'.png" alt="">'+TOOLS[st.tool].n:"（①で えらぶ）";
  var p=st.pick.length?st.pick.map(function(id){return OBJ[id].n.replace(/^[アイウAB]　/,function(m){return m.trim();});}).join("・"):"（「これだ？」を おす）";
  $("sum").innerHTML='決め手：<b>'+t+'</b><br>答え：<b>'+p+'</b>';
}
$("tools").addEventListener("click",function(e){
  var b=e.target.closest(".tool");if(!b) return;
  st.tool=b.dataset.t;
  [].forEach.call($("tools").children,function(x){x.classList.toggle("on",x===b);});
  tone([660],.06);paintStep();paintSum();
  var c2=$("c2").getBoundingClientRect();
  if(c2.top>innerHeight*.6) $("c2").scrollIntoView({behavior:"smooth",block:"start"});
});
$("sus").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b) return;
  var card=b.closest(".s"), id=card.dataset.id, o=OBJ[id];
  if(b.dataset.act==="pick"){
    var k=st.pick.indexOf(id);
    if(k>=0) st.pick.splice(k,1); else st.pick.push(id);
    tone([k>=0?440:880],.07);paintSus();paintSum();return;
  }
  if(!st.tool) return;
  var r=result(st.tool,o), T=TOOLS[st.tool];
  (st.ev[id]=st.ev[id]||{})[st.tool]=r;
  tone(r.na?[300]:(r.hit?[523,784]:[523]),.08);
  paintSus();
  $("ovc").innerHTML='<p class="rh">じっけん けっか</p><div class="stage">'+scene(st.tool,o,r)+'</div>'+
    '<div class="res"><b>'+o.n+'</b> × '+T.n+'<br>'+(r.na?'<span class="na">'+r.txt+'</span>':r.txt)+'</div>'+
    '<div class="row"><button class="btn" data-a="pick">'+(st.pick.indexOf(id)>=0?"「これだ？」を はずす":"「これだ？」を つける")+'</button><button class="btn go" data-a="close">OK</button></div>';
  st.last=id;
  $("ov").classList.add("on");
});

$("answerBtn").addEventListener("click",function(){
  var c=st.c;
  if(!st.tool){ov("ng","まだ だよ！","<p>① で <b>決め手の 実験</b>（道具・薬品）を えらんでね。</p>",false);return;}
  if(!st.pick.length){ov("ng","まだ だよ！","<p>犯人だと 思う ものに「<b>これだ？</b>」を おしてね。</p>",false);return;}
  var used=c.sus.some(function(id){return st.ev[id]&&st.ev[id][st.tool];});
  if(!used){ov("ng","証拠が ない！","<p>"+TOOLS[st.tool].em+" <b>"+TOOLS[st.tool].n+"</b>で、まだ 1つも しらべて いないよ。<br>決め手の 実験を、じっさいに ためしてみよう。</p>",false);return;}
  if(st.tool!==c.key){
    st.miss++;tone([392,330],.14,"sawtooth");
    ov("ng","うーん、ちがうかも…","<p>"+TOOLS[st.tool].em+" <b>"+TOOLS[st.tool].n+"</b>は「"+TOOLS[st.tool].what+"」。<br>この なぞの 決め手には ならないよ。<br>ほかの 道具も ためしてみよう！</p>",false);return;
  }
  var miss=c.ans.filter(function(id){return st.pick.indexOf(id)<0;}).length;
  var extra=st.pick.filter(function(id){return c.ans.indexOf(id)<0;}).length;
  if(miss||extra){
    st.miss++;tone([392,330],.14,"sawtooth");
    var m=[];
    if(extra) m.push("犯人では ない ものが <b>まざっている</b>");
    if(miss) m.push("まだ <b>見のがしている</b> ものが ある");
    var untested=c.sus.filter(function(id){return !(st.ev[id]&&st.ev[id][c.key]);}).length;
    ov("ng","おしい！","<p>決め手の 実験は ばっちり！<br>でも、"+m.join("し、")+"みたい。</p>"+
      (untested?"<p>"+TOOLS[c.key].em+" "+TOOLS[c.key].n+"で まだ しらべていない ものが "+untested+"こ あるよ。</p>":"<p>しらべた 結果を もう一度 見くらべてみよう。</p>"),false);return;
  }
  var stars=st.miss===0?3:st.miss===1?2:1;
  if((REC[st.i]||0)<stars){REC[st.i]=stars;save(REC);}
  tone([523,659,784,1047],.11);
  ov("ok","じけん かいけつ！",'<div class="big">'+"★".repeat(stars)+"<i>"+"★".repeat(3-stars)+"</i></div>"+
    '<div class="exp">'+c.exp+'</div><p class="grade">'+c.g+'</p>',true);
});

function ov(mood,h,html,done){
  var btns=done?
    '<div class="row"><button class="btn" data-a="files">ファイルへ</button>'+(st.i<CASES.length-1?'<button class="btn go" data-a="next">つぎの じけん ▶</button>':'<button class="btn go" data-a="files">ぜんぶ かいけつ！</button>')+'</div>':
    '<div class="row"><button class="btn go" data-a="close">もういちど しらべる</button></div>';
  $("ovc").innerHTML='<div class="face">'+marika(mood)+'</div><h3 class="'+mood+'">'+h+'</h3>'+html+btns;
  $("ov").classList.add("on");
}
$("ovc").addEventListener("click",function(e){
  var b=e.target.closest("button");if(!b) return;
  var a=b.dataset.a;$("ov").classList.remove("on");
  if(a==="pick"){var k=st.pick.indexOf(st.last);if(k>=0) st.pick.splice(k,1); else st.pick.push(st.last);tone([k>=0?440:880],.07);paintSus();paintSum();}
  else if(a==="next") start(st.i+1);
  else if(a==="files") toTitle();
});
function toTitle(){
  $("play").style.display="none";$("board").style.display="none";$("title").style.display="flex";
  paintFiles();window.scrollTo(0,0);
}
$("backBtn").addEventListener("click",toTitle);

paintFiles();
})();
</script>
</body>
