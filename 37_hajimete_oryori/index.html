<style>
:root{
  --ink:#3A2A17; --sub:#6F5A3C; --faint:#A89274; --paper:#FFFDF6; --dark:#5A3A1A;
  --ok:#2FA36B; --ng:#D9493A; --gold:#F2B705; --red:#E0482E; --wood:#C98B4E; --wood2:#A96A33;
}
[hidden]{display:none!important}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{margin:0;font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;color:var(--ink);
  background:#F6EEDC;line-height:1.7;overflow-x:hidden;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
/* キッチンの かべ（白い タイル） */
body::before{content:"";position:fixed;inset:0;z-index:-1;
  background:linear-gradient(#0000 0 0),
   repeating-linear-gradient(0deg,#E6DCC8 0 2px,transparent 2px 48px),repeating-linear-gradient(90deg,#E6DCC8 0 2px,transparent 2px 48px),
   linear-gradient(180deg,#FFFBF2,#F4EAD6)}
button{font-family:inherit;color:inherit;cursor:pointer}
img{display:block}
.wrap{max-width:900px;margin:0 auto;padding:0 12px calc(24px + env(safe-area-inset-bottom))}
.scr{display:none}.scr.on{display:block}
.btn{border:3px solid var(--dark);background:#fff;color:var(--ink);font-weight:900;font-size:1rem;padding:10px 20px;border-radius:14px;box-shadow:0 4px 0 var(--dark);transition:transform .1s}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 var(--dark)}
.btn.go{background:linear-gradient(#FF8A5C,#E0482E);color:#fff;border-color:#8A2A12;box-shadow:0 5px 0 #8A2A12;font-size:1.2rem;padding:12px 30px}
.btn.sm{font-size:.85rem;padding:6px 12px;border-width:2px;box-shadow:0 3px 0 var(--dark)}
.btn:disabled{opacity:.4}
.backlink{display:inline-block;margin:12px 0;color:var(--sub);font-weight:700;text-decoration:none;font-size:.9rem}

/* タイトル */
.ttl{margin:0 auto 6px;text-align:center}.ttl img{display:inline-block;width:min(78vw,380px);height:auto;filter:drop-shadow(0 4px 6px #0003)}
.collage{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;max-width:640px;margin:0 auto}
.collage img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;border:3px solid #fff;box-shadow:0 3px 8px #0002}
.lead{max-width:640px;margin:14px auto;background:var(--paper);border-radius:16px;padding:12px 16px;border:2px solid #E6D2B0;font-weight:700}
.center{text-align:center}
.rec{color:var(--sub);font-weight:700;font-size:.9rem;margin-top:8px}

/* ボード */
.bhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:12px 0}
.bhead h2{margin:0;font:400 1.3rem "Mochiy Pop One"}
.mgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media(max-width:620px){.mgrid{grid-template-columns:repeat(2,1fr)}}
.mc{position:relative;border:3px solid var(--dark);border-radius:16px;background:#fff;padding:0;overflow:hidden;box-shadow:0 4px 0 var(--dark);text-align:left}
.mc:active{transform:translateY(3px);box-shadow:0 1px 0 var(--dark)}
.mc img{width:100%;aspect-ratio:4/3;object-fit:cover}
.mc .no{position:absolute;left:8px;top:8px;background:var(--red);color:#fff;font:400 .9rem "Mochiy Pop One";padding:1px 10px;border-radius:99px;border:2px solid #fff}
.mc .tx{padding:6px 10px 8px}
.mc b{display:block;font-size:1rem;line-height:1.35}
.mc small{display:block;color:var(--sub);font-size:.78rem;line-height:1.4}
.mc .st{position:absolute;right:8px;top:8px;background:#fffd;border-radius:99px;padding:0 8px;font-size:.9rem;color:var(--gold);font-weight:900;letter-spacing:-.05em}
.mc .st i{color:#ccc;font-style:normal}
.credit{margin-top:22px;font-size:.72rem;color:var(--sub)}
.credit summary{cursor:pointer;font-weight:700}
.credit a{color:var(--sub)}

/* プレイ */
.phead{display:flex;align-items:center;gap:8px;margin:8px 0}
.phead h2{margin:0;flex:1;font:400 1.05rem/1.3 "Mochiy Pop One"}
.dots{display:flex;gap:3px;flex-wrap:wrap;max-width:45%}
.dots i{width:10px;height:10px;border-radius:50%;background:#E3D3B6}
.dots i.d{background:var(--ok)}
@media(max-width:520px){.dots{max-width:34%}.dots i{width:7px;height:7px}.phead h2{font-size:.92rem}}.dots i.c{background:var(--red)}
.msg{display:flex;gap:8px;align-items:flex-start;background:#fff;border:3px solid var(--dark);border-radius:16px;padding:8px 12px;margin-bottom:8px;min-height:62px}
.msg .face{font-size:2rem;line-height:1}
.msg p{margin:0;font-weight:900;font-size:1.05rem;line-height:1.5}
.msg p small{display:block;font-weight:700;font-size:.85rem;color:var(--sub)}
.stage{position:relative;width:100%;max-width:min(720px,calc((100vh - 250px)*4/3));min-width:min(100%,300px);margin:0 auto;aspect-ratio:4/3;border-radius:18px;overflow:hidden;border:3px solid var(--dark);
  background:linear-gradient(180deg,#FFF8EA 0 64%,#D9A869 64% 66%,#C98B4E 66%);touch-action:none}
.stage.board{background:linear-gradient(180deg,#FFF8EA 0 8%,#C98B4E 8%)}
.stage.sink{background:radial-gradient(ellipse at 50% 55%,#DCE6EC 0 55%,#B8C6CE 56% 60%,#E9E1D0 61%)}
.stage.plain{background:#FFF8EA}
.ctrl{max-width:720px;margin:10px auto 0;display:flex;flex-wrap:wrap;gap:8px;justify-content:center;align-items:center}
.toast{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:#fff;border:3px solid var(--dark);border-radius:14px;padding:6px 14px;font-weight:900;
  max-width:92%;text-align:center;z-index:30;box-shadow:0 4px 0 #0003;animation:pop .25s;font-size:.98rem;line-height:1.45}
.toast.ng{border-color:var(--ng);color:#8A1F14;background:#FFF1EE}.toast.ok{border-color:var(--ok);color:#135C3A;background:#EFFFF6}
@keyframes pop{from{transform:translate(-50%,-6px) scale(.9);opacity:0}}
.cur{position:absolute;pointer-events:none;font-size:2.4rem;transform:translate(-50%,-60%);z-index:20;display:none;filter:drop-shadow(0 2px 2px #0004)}

/* えらぶ（写真） */
.opts{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:12px}
.opt{border:4px solid #fff;border-radius:14px;padding:0;overflow:hidden;background:#fff;box-shadow:0 3px 8px #0003;position:relative}
.opt img{width:100%;height:100%;object-fit:cover}
.opt.ng{border-color:var(--ng);filter:grayscale(.7)}.opt.ok{border-color:var(--ok);box-shadow:0 0 0 4px var(--ok)}
.opt .nm{position:absolute;left:0;right:0;bottom:0;background:#000a;color:#fff;font-weight:900;text-align:center;font-size:.95rem}
.shake{animation:shake .35s}
@keyframes shake{25%{transform:translateX(-6px)}50%{transform:translateX(6px)}75%{transform:translateX(-4px)}}
/* クイズ */
.quiz{position:absolute;inset:0;display:flex;flex-direction:column;justify-content:center;gap:10px;padding:14px}
.quiz .q{font-weight:900;font-size:1.15rem;text-align:center;line-height:1.5}
.quiz button{border:3px solid var(--dark);border-radius:14px;background:#fff;font-weight:900;font-size:1rem;padding:10px 12px;text-align:left;line-height:1.4;box-shadow:0 3px 0 var(--dark)}
.quiz button.ok{background:#E3FAEC;border-color:var(--ok)}.quiz button.ng{background:#FFE7E2;border-color:var(--ng)}
.exp{background:#FFFBE8;border:2px dashed #D9B24C;border-radius:12px;padding:8px 12px;font-weight:700;font-size:.95rem;line-height:1.55}
.big{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);font:400 7rem/1 "Mochiy Pop One";z-index:25;pointer-events:none;animation:bigp .5s}
.big.ok{color:var(--ok);text-shadow:0 0 0 #fff,0 4px 0 #fff}.big.ng{color:var(--ng)}
@keyframes bigp{from{transform:translate(-50%,-50%) scale(.3);opacity:0}}
/* せつめい */
.say{position:absolute;inset:0;display:flex;flex-wrap:wrap;align-content:center;justify-content:center;gap:10px;padding:12px}
.say figure{margin:0;width:calc(33% - 8px);min-width:120px;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 3px 8px #0002}
.say figure.one{width:80%}
.say figure img{width:100%;aspect-ratio:4/3;object-fit:cover}
.say figcaption{text-align:center;font-weight:900;font-size:.9rem;padding:2px}
/* こする・きる */
.item{position:absolute;left:12%;top:10%;width:76%;height:76%}
.item .ph{position:absolute;inset:0;border-radius:50%;box-shadow:0 6px 10px #0003}
.item canvas{position:absolute;inset:0;width:100%;height:100%;border-radius:50%}
.item svg{position:absolute;inset:0;width:100%;height:100%}
.strip{position:absolute;inset:0;border-radius:50%;transition:transform .25s;box-shadow:0 5px 8px #0002}
.guide{position:absolute;top:2%;bottom:2%;border-left:3px dashed #fff;filter:drop-shadow(0 0 2px #000a);pointer-events:none}
.knife{position:absolute;font-size:3rem;z-index:5;pointer-events:none;animation:chop .3s forwards}
@keyframes chop{from{transform:translate(-30%,-130%) rotate(-30deg)}to{transform:translate(-30%,-20%) rotate(-30deg);opacity:.2}}
.bar{position:relative;width:min(90%,420px);height:18px;border:3px solid var(--dark);border-radius:99px;background:#fff;overflow:hidden}
.bar i{position:absolute;left:0;top:0;bottom:0;background:linear-gradient(90deg,#FFB14A,#E0482E);width:0}
.bar span{position:absolute;inset:0;text-align:center;font-size:.72rem;font-weight:900;line-height:12px}
.hands{display:flex;gap:12px}
.hands button{font-size:1rem;font-weight:900;border:3px solid var(--dark);border-radius:14px;background:#fff;padding:8px 14px;box-shadow:0 3px 0 var(--dark);line-height:1.3}
.hands button b{display:block;font-size:2.2rem}
/* ひ */
.kit svg{position:absolute;inset:0;width:100%;height:100%}
.chunk{position:absolute;border-radius:32%;background-size:300% 300%;transform:translate(-50%,-50%);box-shadow:0 2px 3px #0005;transition:left .2s,top .2s,filter 1s}
.chunk.e{background:none;box-shadow:none;font-size:1.6rem;display:grid;place-items:center}
.aku{position:absolute;width:9%;aspect-ratio:1.4;border-radius:50%;background:radial-gradient(circle at 40% 40%,#fff,#E8D8B8 60%,#C8B08A);transform:translate(-50%,-50%);z-index:4;box-shadow:0 0 0 2px #fff8;animation:akup .4s}
@keyframes akup{from{transform:translate(-50%,-50%) scale(.2)}}
.fire{display:flex;gap:4px;background:#fff;border:3px solid var(--dark);border-radius:14px;padding:4px}
.fire button,.fan{border:2px solid var(--dark);background:#fff;border-radius:10px;font-weight:900;padding:5px 9px;font-size:.9rem;line-height:1.2}
.fire button.on{background:#FFE08A}.fire button[data-l=off].on{background:#E4E4E4}
.fan.on{background:#CFF2FF}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;width:100%}
.chip{display:flex;align-items:center;gap:5px;border:3px solid var(--dark);border-radius:12px;background:#fff;padding:3px 8px 3px 3px;font-weight:900;font-size:.9rem;box-shadow:0 3px 0 var(--dark)}
.chip img,.chip .em{width:40px;height:30px;border-radius:7px;object-fit:cover;font-size:1.5rem;display:grid;place-items:center}
.chip.used{opacity:.35;box-shadow:none}
.clock{position:absolute;right:4%;top:4%;background:#fff;border:3px solid var(--dark);border-radius:14px;padding:4px 12px;font:400 1.6rem "Mochiy Pop One";z-index:6}
.clock small{font:900 .75rem "Zen Kaku Gothic New";display:block;color:var(--sub)}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{animation:spin .6s linear infinite;transform-origin:center;transform-box:fill-box}
@keyframes bub{0%{transform:translateY(0) scale(.4);opacity:0}30%{opacity:1}100%{transform:translateY(-14px) scale(1);opacity:0}}
.bub{animation:bub 1s infinite;transform-box:fill-box}
@keyframes steam{0%{transform:translateY(0);opacity:0}40%{opacity:.7}100%{transform:translateY(-40px);opacity:0}}
.steam{animation:steam 2.4s infinite;transform-box:fill-box}
@keyframes flick{50%{transform:scaleY(.8)}}
.flm{animation:flick .3s infinite;transform-box:fill-box;transform-origin:bottom}
/* はかる */
.pour{touch-action:none}
/* ならべる */
.ord{position:absolute;inset:0;display:grid;grid-template-columns:1fr 1fr;gap:10px;padding:14px}
.ord button{border:3px solid var(--dark);border-radius:16px;background:#fff;font-weight:900;font-size:1rem;position:relative;box-shadow:0 3px 0 var(--dark)}
.ord button b{display:block;font-size:3rem;line-height:1.2}
.ord button i{position:absolute;left:8px;top:6px;width:32px;height:32px;border-radius:50%;background:var(--ok);color:#fff;font:400 1.1rem/32px "Mochiy Pop One";font-style:normal}
/* できあがり */
.serve{position:absolute;inset:0;display:grid;place-items:center;background:radial-gradient(circle,#FFF6D6,#FFE3A6)}
.serve img{width:84%;aspect-ratio:4/3;object-fit:cover;border-radius:18px;border:6px solid #fff;box-shadow:0 8px 20px #0004;animation:bigp .6s}
.serve b{position:absolute;top:3%;font:400 2rem "Mochiy Pop One";color:var(--red);text-shadow:0 3px 0 #fff}
.res{max-width:560px;margin:10px auto;background:var(--paper);border:3px solid var(--dark);border-radius:18px;padding:16px;text-align:center}
.res .stars{font-size:3rem;color:var(--gold);letter-spacing:.05em}.res .stars i{color:#ddd;font-style:normal}
.res ul{text-align:left;font-weight:700;padding-left:1.2em;margin:8px 0}
.res li{margin:4px 0}
</style>
</head>

  <p class="lead">ほうちょうは「ねこの手」。火を つける まえに かんきせん。<br>道具の 名前から、ごはん・みそしる・カレーライス、さいごの かたづけまで。本物の 写真で おりょうりの 手じゅんを 体験しよう！<br><small>※ほんとうの 火や ほうちょうは、おうちの人と いっしょに つかおうね。</small></p>

<script src="photos.js?v=1"></script>
<script>
'use strict';
const PV='?v=1';
const $=id=>document.getElementById(id);
const PH={};PHOTOS.forEach(p=>PH[p.k]=p);
const P=k=>`photo/${PH[k].p}.jpg${PV}`;
const rnd=(a,b)=>a+Math.random()*(b-a);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const REC='hajimete_oryori_rec';
function loadRec(){try{return JSON.parse(localStorage.getItem(REC))||{}}catch(e){return{}}}
function saveRec(r){try{localStorage.setItem(REC,JSON.stringify(r))}catch(e){}}

/* ---------- 道具（名前あて） ---------- */
const TOOLS={
  shamoji:'ごはんを まぜたり、おちゃわんに よそったり する。',
  otama:'しるや スープを すくう。みそを とかす ときにも つかう。',
  furaigaeshi:'やいた ものを ひっくりかえしたり、もちあげたり する。',
  furaipan:'いためる・やく。そこが ひろくて あさい。',
  nabe:'にる・ゆでる・おゆを わかす。',
  hocho:'ざいりょうを 切る。はを 人に むけない。',
  manaita:'ざいりょうを 切る ときの 台。にくと やさいで 気を つける。',
  piiraa:'やさいの かわを うすく むく。',
  saibashi:'りょうり用の ながい おはし。まぜる・とりわける。',
  zaru:'あらった やさいや ゆでた めんの 水を きる。',
  keiryo_cup:'水などの りょうを はかる。1カップ＝200mL。',
  keiryo_spoon:'大さじ＝15mL、小さじ＝5mL を はかる。',
  awadateki:'たまごや クリームを まぜる・あわだてる。',
  suihanki:'おこめと 水を 入れて、ごはんを たく。',
  kankisen:'けむりや においを いえの 外へ だす。',
  gasu:'ガスの 火で なべや フライパンを あたためる。',
  ih:'火を つかわず、でんきの 力で なべの そこを あたためる。',
  sponji:'せんざいを つけて しょっきを あらう。',
  mizukiri:'あらった しょっきを ならべて かわかす。'
};
/* 写真の ない ざいりょう */
const EMO={abura:['あぶら','🫗'],mizu:['水','💧'],roux:['カレールー','🟫'],shio:['しお','🧂'],niboshi_out:['にぼしを とりだす','🥢']};
/* 切る・あらう ときに ざいりょうだけ 大きく 見せる（写真の 大きさ%・よこ%・たて%） */
const ZOOM={jagaimo:[230,22,78],tamanegi:[190,50,62],kyabetsu:[150,50,50],kyuri:[170,50,42],tomato:[170,52,52],tofu:[230,4,40],butaniku:[210,42,62],ninjin:[130,50,50],piman:[130,50,50],negi:[130,50,50],retasu:[130,50,50]};
const bgs=k=>{const z=ZOOM[k]||[100,50,50];return `background-image:url(${P(k)});background-size:${z[0]}% ${z[0]}%;background-position:${z[1]}% ${z[2]}%`};
/* 先方の絵（art/。写真の かわり） */
const ART={kome:['おこめ','art/kome.png?v=1'],roux:['カレールー','art/roux.png?v=1'],abura:['サラダあぶら','art/abura.png?v=1']};
const nameOf=k=>PH[k]?PH[k].n:ART[k]?ART[k][0]:(EMO[k]?EMO[k][0]:k);
const picOf=k=>PH[k]?P(k):ART[k]?ART[k][1]:'';

/* ---------- 音 ---------- */
let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)()}catch(e){}}if(AC&&AC.state==='suspended')AC.resume();return AC}
function tone(f,d=.12,type='sine',v=.18,when=0){const a=ac();if(!a)return;const o=a.createOscillator(),g=a.createGain();o.type=type;o.frequency.value=f;
  const t=a.currentTime+when;g.gain.setValueAtTime(v,t);g.gain.exponentialRampToValueAtTime(.001,t+d);o.connect(g).connect(a.destination);o.start(t);o.stop(t+d+.02)}
const sOK=()=>{tone(880,.12,'sine',.2);tone(1320,.18,'sine',.2,.1)};
const sNG=()=>{tone(220,.25,'square',.1)};
const sTap=()=>tone(660,.05,'triangle',.12);
function noise(d=.08,v=.2,f=2500){const a=ac();if(!a)return;const b=a.createBuffer(1,a.sampleRate*d,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(1-i/c.length);
  const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();fl.type='bandpass';fl.frequency.value=f;g.gain.value=v;s.buffer=b;s.connect(fl).connect(g).connect(a.destination);s.start()}
/* ジュー（いためている あいだだけ） */
let SZ=null;
function sizzle(on){const a=on?ac():AC;if(!a)return;
  if(on&&!SZ){const b=a.createBuffer(1,a.sampleRate*2,a.sampleRate),c=b.getChannelData(0);for(let i=0;i<c.length;i++)c[i]=(Math.random()*2-1)*(Math.random()<.3?1:.3);
    const s=a.createBufferSource(),fl=a.createBiquadFilter(),g=a.createGain();s.buffer=b;s.loop=true;fl.type='highpass';fl.frequency.value=3000;g.gain.value=.05;s.connect(fl).connect(g).connect(a.destination);s.start();SZ={s,g}}
  if(!on&&SZ){try{SZ.s.stop()}catch(e){}SZ=null}}

/* ---------- 画面 ---------- */
function show(id){document.querySelectorAll('.scr').forEach(s=>s.classList.toggle('on',s.id==='s-'+id));scrollTo(0,0);
  if(id==='board')buildBoard();if(id==='title')recLine()}
document.addEventListener('click',e=>{const b=e.target.closest('[data-go]');if(b){sTap();show(b.dataset.go)}});

function recLine(){const r=loadRec(),n=Object.values(r.stars||{}).reduce((a,b)=>a+b,0);$('recline').textContent=n?`あつめた ★ ${n} / ${MIS.length*3}`:''}
$('collage').innerHTML=['curry_rice','misoshiru','medamayaki','salad'].map(k=>`<img src="${P(k)}" alt="">`).join('');

function buildBoard(){const S=(loadRec().stars)||{};
  $('mgrid').innerHTML=MIS.map((m,i)=>{const s=S[m.id]||0;
    return `<button class="mc" data-m="${i}"><img src="${P(m.pic)}" alt="" loading="lazy"><span class="no">${i+1}</span>${s?`<span class="st">${'★'.repeat(s)}<i>${'★'.repeat(3-s)}</i></span>`:''}<span class="tx"><b>${m.title}</b><small>${m.sub}</small></span></button>`}).join('');
  $('credits').innerHTML=PHOTOS.map(p=>`${p.n}：<a href="${p.u}" target="_blank" rel="noopener">${p.a||'作者不明'}</a>（${p.l}）`).join('　／　')}
$('mgrid').addEventListener('click',e=>{const b=e.target.closest('[data-m]');if(b){sTap();start(+b.dataset.m)}});

/* ---------- ミッション進行 ---------- */
let G=null;             // いま あそんでいる ミッション
function start(i){const m=MIS[i];G={i,m,steps:m.steps(),si:0,miss:0,fan:false,neko:false,alive:true,timers:[]};
  $('ptitle').textContent=m.title;show('play');next()}
function next(){clearStep();if(!G)return;
  if(G.si>=G.steps.length)return finish();
  const s=G.steps[G.si++];dots();
  STEP[s.t](s)}
function dots(){$('dots').innerHTML=G.steps.map((_,i)=>`<i class="${i<G.si-1?'d':i===G.si-1?'c':''}"></i>`).join('')}
function clearStep(){if(G){G.timers.forEach(t=>{clearInterval(t);clearTimeout(t)});G.timers=[]}sizzle(false);
  const st=$('stage');st.className='stage';st.innerHTML='';delete st.dataset.done;st.onpointerdown=st.onpointermove=st.onpointerup=st.onpointerleave=null;$('ctrl').innerHTML=''}
const every=(ms,f)=>{const t=setInterval(f,ms);G.timers.push(t);return t};
const cap=(el,e)=>{try{el.setPointerCapture(e.pointerId)}catch(_){}};
const later=(ms,f)=>{const t=setTimeout(f,ms);G.timers.push(t);return t};
$('quit').onclick=()=>{sTap();clearStep();G=null;show('board')};
function say(t,sub,face='🧑‍🍳'){$('msg').innerHTML=t+(sub?`<small>${sub}</small>`:'');$('face').textContent=face}
function toast(t,cls=''){const st=$('stage');st.querySelectorAll('.toast').forEach(x=>x.remove());const d=document.createElement('div');d.className='toast '+cls;d.innerHTML=t;st.appendChild(d);
  if(G)later(3200,()=>d.remove())}
function bigMark(ok){const d=document.createElement('div');d.className='big '+(ok?'ok':'ng');d.textContent=ok?'◯':'✕';$('stage').appendChild(d);setTimeout(()=>d.remove(),700)}
function nextBtn(label='つぎへ ▶'){const b=document.createElement('button');b.className='btn go';b.textContent=label;b.onclick=()=>{sTap();next()};$('ctrl').appendChild(b)}
function finish(){const m=G.m,miss=G.miss,s=miss===0?3:miss<=2?2:1;const r=loadRec();r.stars=r.stars||{};r.stars[m.id]=Math.max(r.stars[m.id]||0,s);saveRec(r);
  const idx=G.i;G=null;clearStep();
  $('res').innerHTML=`<h2 style="font:400 1.4rem 'Mochiy Pop One';margin:0">${m.title}<br>クリア！</h2>
   <div class="stars">${'★'.repeat(s)}<i>${'★'.repeat(3-s)}</i></div>
   <p style="margin:0;font-weight:900">${miss===0?'まちがい なし！ パーフェクト！':`まちがい ${miss}かい`}</p>
   <div class="exp" style="margin-top:10px"><b>きょう おぼえたこと</b><ul>${m.learn.map(x=>`<li>${x}</li>`).join('')}</ul></div>
   <p style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin-top:14px"><button class="btn" id="again">もういちど</button><button class="btn go" data-go="board">メニューへ</button></p>`;
  show('res');sOK();$('again').onclick=()=>{sTap();start(idx)}}

/* ======================================================
   ステップの しゅるい
   ====================================================== */
const STEP={};

/* せつめい：写真を ならべて 見せる */
STEP.say=s=>{say(s.txt,s.sub);const st=$('stage');st.className='stage plain';
  st.innerHTML=`<div class="say">${(s.pics||[]).map(k=>`<figure class="${s.pics.length===1?'one':''}"><img src="${picOf(k)}" alt=""${ART[k]?' style="object-fit:contain;padding:8px;background:#FFF8EA"':''}><figcaption>${nameOf(k)}</figcaption></figure>`).join('')}</div>`;nextBtn()};

/* 写真を えらぶ（道具の 名前） */
STEP.pick=s=>{const ans=s.ans,others=shuffle((s.opts||Object.keys(TOOLS)).filter(k=>k!==ans)).slice(0,3),list=shuffle([ans,...others]);
  say(s.q||`「${nameOf(ans)}」は どれかな？`,s.sub);const st=$('stage');st.className='stage plain';let tried=false;
  st.innerHTML=`<div class="opts">${list.map(k=>`<button class="opt" data-k="${k}"><img src="${P(k)}" alt=""></button>`).join('')}</div>`;
  st.querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const k=b.dataset.k;if(b.classList.contains('ng')||st.dataset.done)return;
    b.insertAdjacentHTML('beforeend',`<span class="nm">${nameOf(k)}</span>`);
    if(k===ans){st.dataset.done=1;b.classList.add('ok');bigMark(true);sOK();
      say(`そう！ これが「${nameOf(ans)}」。`,TOOLS[ans]||s.exp||'');nextBtn()}
    else{b.classList.add('ng','shake');sNG();if(!tried){tried=true;G.miss++}toast(`それは「${nameOf(k)}」。${TOOLS[k]||''}`,'ng')}})};

/* クイズ（文） */
STEP.quiz=s=>{say(s.q,s.sub,'🤔');const st=$('stage');st.className='stage plain';const ch=shuffle(s.c.map((t,i)=>({t,ok:i===0})));
  st.innerHTML=`<div class="quiz">${ch.map((c,i)=>`<button data-i="${i}">${c.t}</button>`).join('')}</div>`;
  st.querySelectorAll('.quiz button').forEach(b=>b.onclick=()=>{if(st.dataset.done)return;st.dataset.done=1;const c=ch[+b.dataset.i];
    st.querySelectorAll('.quiz button').forEach(x=>{if(ch[+x.dataset.i].ok)x.classList.add('ok')});
    if(c.ok){sOK();bigMark(true)}else{b.classList.add('ng');sNG();bigMark(false);G.miss++}
    const q=st.querySelector('.quiz');q.insertAdjacentHTML('beforeend',`<div class="exp">${c.ok?'◯ せいかい！ ':'✕ ざんねん。'}${s.exp}</div>`);nextBtn()})};

/* ならべる じゅんばん */
STEP.order=s=>{say(s.q,'あらう じゅんに タップしよう','🤔');const st=$('stage');st.className='stage plain';let n=0,missed=false;
  st.innerHTML=`<div class="ord">${shuffle(s.items.map((it,i)=>({...it,i}))).map(it=>`<button data-i="${it.i}"><b>${it.e}</b>${it.n}</button>`).join('')}</div>`;
  st.querySelectorAll('.ord button').forEach(b=>b.onclick=()=>{if(b.querySelector('i'))return;
    if(+b.dataset.i===n){n++;sTap();b.insertAdjacentHTML('afterbegin',`<i>${n}</i>`);
      if(n===s.items.length){sOK();say('できた！',s.why);nextBtn()}}
    else{sNG();b.classList.add('shake');setTimeout(()=>b.classList.remove('shake'),400);if(!missed){missed=true;G.miss++}toast(s.why,'ng')}})};

/* できあがり */
STEP.serve=s=>{say(`${nameOf(s.k)}の できあがり！`,s.sub||'おいしそう！','😋');const st=$('stage');
  st.innerHTML=`<div class="serve"><b>できあがり！</b><img src="${P(s.k)}" alt=""></div>`;sOK();tone(1568,.3,'sine',.15,.3);nextBtn('クリア！ ▶')};

/* ---------- こする（あらう・かわを むく・しょっきを あらう） ---------- */
const DISH={
  cup:`<svg viewBox="0 0 100 100"><path d="M28 12h44l-6 78H34z" fill="#DDF2FF" stroke="#8FB9D6" stroke-width="3"/><path d="M31 20h38" stroke="#fff" stroke-width="3"/></svg>`,
  plate:`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#fff" stroke="#C9D3DA" stroke-width="3"/><circle cx="50" cy="50" r="30" fill="#F7F9FA" stroke="#DDE3E8" stroke-width="2"/></svg>`,
  bowl:`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#fff" stroke="#3A5A8A" stroke-width="5"/><circle cx="50" cy="50" r="36" fill="#FAFCFF" stroke="#E2E8F0" stroke-width="2"/></svg>`,
  pan:`<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="#3B3F46" stroke="#22252A" stroke-width="4"/><circle cx="50" cy="50" r="38" fill="#4A4F57"/></svg>`
};
STEP.rub=s=>{const mode=s.mode;const st=$('stage');st.className='stage '+(mode==='peel'?'board':'sink');
  const cursor={wash:'💧',peel:'🥄',dish:'🧽'}[mode];
  const title={wash:`${nameOf(s.k)}を あらおう`,peel:`${nameOf(s.k)}の かわを むこう`,dish:`${s.name}を あらおう`}[mode];
  const sub={wash:'ゆびで こすって どろを おとそう',peel:'ピーラーを 手前に ひくように こすろう（ゆびに 気を つけて）',dish:'スポンジで こすって よごれを おとそう'}[mode];
  say(title,sub,'🧼');
  st.innerHTML=`<div class="item">${s.k?`<div class="ph" style="${bgs(s.k)}"></div>`:DISH[s.dish]}<canvas></canvas></div><div class="cur">${cursor}</div>`;
  const cv=st.querySelector('canvas'),box=st.querySelector('.item'),cur=st.querySelector('.cur');
  const W=cv.width=400,H=cv.height=300,ctx=cv.getContext('2d');
  const GX=20,GY=15,cell=new Uint8Array(GX*GY);let total=0,phase=1;
  const inOval=(x,y)=>((x/W-.5)/.5)**2+((y/H-.5)/.5)**2<.92;
  function paint(kind){ctx.globalCompositeOperation='source-over';
    if(kind==='peel'){ctx.fillStyle='rgba(120,84,40,.72)';ctx.beginPath();ctx.ellipse(W/2,H/2,W/2,H/2,0,0,7);ctx.fill();
      ctx.strokeStyle='rgba(80,50,20,.5)';ctx.lineWidth=2;for(let i=0;i<30;i++){ctx.beginPath();const x=rnd(40,360),y=rnd(40,260);ctx.moveTo(x,y);ctx.lineTo(x+rnd(-20,20),y+rnd(10,30));ctx.stroke()}
      for(let i=0;i<GX*GY;i++){const x=(i%GX+.5)*W/GX,y=((i/GX|0)+.5)*H/GY;if(inOval(x,y)){cell[i]=1}}}
    else{const blobs=kind==='foam'?[]:[];const n=kind==='wash'?14:10;const col=kind==='wash'?'rgba(105,72,38,.9)':s.dish==='cup'?'rgba(255,255,255,.85)':'rgba(190,110,30,.85)';
      if(kind==='foam'){ctx.fillStyle='rgba(255,255,255,.9)';for(let i=0;i<GX*GY;i++){if(!cell[i])continue}}
      for(let k=0;k<n;k++){let x,y;do{x=rnd(60,340);y=rnd(50,250)}while(!inOval(x,y));const r=rnd(22,40);
        ctx.fillStyle=col;ctx.beginPath();for(let a=0;a<6.3;a+=.5){const rr=r*rnd(.7,1.1);ctx.lineTo(x+Math.cos(a)*rr,y+Math.sin(a)*rr*.8)}ctx.fill();blobs.push([x,y,r])}
      for(let i=0;i<GX*GY;i++){const x=(i%GX+.5)*W/GX,y=((i/GX|0)+.5)*H/GY;if(blobs.some(([bx,by,r])=>(x-bx)**2+((y-by)/.8)**2<r*r))cell[i]=1}}
    total=cell.reduce((a,b)=>a+b,0)}
  function foam(){ctx.globalCompositeOperation='source-over';for(let i=0;i<GX*GY;i++){const x=(i%GX+.5)*W/GX,y=((i/GX|0)+.5)*H/GY;if(inOval(x,y)&&Math.random()<.55){cell[i]=1;
      ctx.fillStyle='rgba(255,255,255,.92)';ctx.beginPath();ctx.arc(x+rnd(-6,6),y+rnd(-6,6),rnd(9,15),0,7);ctx.fill();ctx.strokeStyle='rgba(170,200,230,.8)';ctx.stroke()}}total=cell.reduce((a,b)=>a+b,0)}
  paint(mode==='dish'?'dish':mode);
  const bar=document.createElement('div');bar.className='bar';bar.innerHTML='<i></i><span></span>';$('ctrl').appendChild(bar);
  let done=false,lastSnd=0;
  function pos(e){const r=box.getBoundingClientRect();return[(e.clientX-r.left)/r.width*W,(e.clientY-r.top)/r.height*H]}
  function rubAt(e){const sr=st.getBoundingClientRect();cur.style.display='block';cur.style.left=(e.clientX-sr.left)+'px';cur.style.top=(e.clientY-sr.top)+'px';
    if(done||!(e.buttons||e.pointerType==='touch'))return;const[x,y]=pos(e),R=mode==='peel'?30:34;
    ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(x,y,R,0,7);ctx.fill();
    if(mode==='dish'&&phase===1){ctx.globalCompositeOperation='source-over';ctx.fillStyle='rgba(255,255,255,.85)';for(let k=0;k<2;k++){ctx.beginPath();ctx.arc(x+rnd(-R,R),y+rnd(-R,R),rnd(5,10),0,7);ctx.fill()}}
    for(let i=0;i<GX*GY;i++){if(!cell[i])continue;const cx=(i%GX+.5)*W/GX,cy=((i/GX|0)+.5)*H/GY;if((cx-x)**2+(cy-y)**2<R*R)cell[i]=0}
    const left=cell.reduce((a,b)=>a+b,0),p=1-left/total;bar.querySelector('i').style.width=(p*100)+'%';
    const now=performance.now();if(now-lastSnd>140){lastSnd=now;noise(.06,mode==='peel'?.25:.12,mode==='peel'?1800:5000)}
    if(p>=.9){ctx.globalCompositeOperation='destination-out';ctx.fillRect(0,0,W,H);
      if(mode==='dish'&&phase===1){phase=2;foam();cur.textContent='💧';say(`${s.name}の あわを 水で ながそう`,'こすって あわを おとそう','🧼');bar.querySelector('i').style.width='0'}
      else{done=true;cur.style.display='none';sOK();bigMark(true);
        say({wash:'ぴかぴか！ きれいに なった！',peel:'つるん！ かわが むけた！',dish:'ぴかぴか！'}[mode],s.after||'');nextBtn()}}}
  st.onpointerdown=e=>{cap(st,e);rubAt(e)};st.onpointermove=rubAt;st.onpointerleave=()=>cur.style.display='none'};

/* ---------- 切る ---------- */
STEP.cut=s=>{const st=$('stage');st.className='stage board';const tear=s.mode==='tear';
  const guides=tear?[]:Array.from({length:s.n},(_,i)=>(i+1)/(s.n+1));const cuts=[];let bara=0,done=false,ready=tear||G.neko;
  say(tear?`${nameOf(s.k)}を 手で ちぎろう`:`${nameOf(s.k)}を ${s.how||'切ろう'}`,tear?'タップした ところで ちぎれるよ':'点線に あわせて、上から 下へ なぞるか タップ',tear?'🙌':'🔪');
  st.innerHTML=`<div class="item"></div><div class="cur">${tear?'🤲':'🔪'}</div>`;const box=st.querySelector('.item');
  function draw(){const xs=[0,...cuts.slice().sort((a,b)=>a-b),1],gap=tear?4:2.2,n=xs.length-1;
    box.innerHTML=xs.slice(0,-1).map((x0,i)=>{const x1=xs[i+1],dx=(i-(n-1)/2)*gap,dy=tear?rnd(-3,3):0,rot=tear?rnd(-8,8):0;
      return `<div class="strip" style="${bgs(s.k)};clip-path:inset(0 ${(1-x1)*100}% 0 ${x0*100}%);transform:translate(${dx}%,${dy}%) rotate(${rot}deg)"></div>`}).join('')+
      guides.filter(g=>!cuts.used?.includes(g)).map(g=>`<div class="guide" style="left:${g*100}%"></div>`).join('')}
  cuts.used=[];draw();
  function askNeko(){const c=$('ctrl');c.innerHTML=`<div style="width:100%;text-align:center;font-weight:900">ざいりょうを おさえる 手は どっち？</div><div class="hands"><button data-h="neko"><b>🐱</b>ねこの手<br><small>ゆびを 丸める</small></button><button data-h="pa"><b>🖐️</b>パー<br><small>ゆびを のばす</small></button></div>`;
    c.querySelectorAll('[data-h]').forEach(b=>b.onclick=()=>{if(b.dataset.h==='neko'){sOK();G.neko=true;ready=true;toast('そう！ ねこの手なら ゆびの 先を 切らないよ','ok');c.innerHTML='<div class="bar"><i></i><span></span></div>';upd()}
      else{sNG();b.classList.add('shake');if(!G.nekoMiss){G.nekoMiss=true;G.miss++}toast('パーだと ゆびの 先を 切って しまうよ！ ゆびを 丸めて「ねこの手」','ng')}})}
  if(!ready)askNeko();else $('ctrl').innerHTML='<div class="bar"><i></i><span></span></div>';
  const need=tear?s.n:guides.length;
  function upd(){const b=$('ctrl').querySelector('.bar i');if(b)b.style.width=(cuts.length/need*100)+'%'}
  let down=null;
  st.onpointermove=e=>{const sr=st.getBoundingClientRect();cur.style.display='block';cur.style.left=(e.clientX-sr.left)+'px';cur.style.top=(e.clientY-sr.top)+'px'};const cur=st.querySelector('.cur');
  st.onpointerdown=e=>{down=[e.clientX,e.clientY]};
  st.onpointerup=e=>{if(!down||done)return;if(!ready){toast('さきに おさえる 手を えらぼう');return}
    const dx=e.clientX-down[0],dy=e.clientY-down[1];down=null;if(Math.abs(dx)>60&&Math.abs(dx)>Math.abs(dy))return;
    const r=box.getBoundingClientRect(),f=((e.clientX-dx/2)-r.left)/r.width;if(f<.04||f>.96)return;
    if(tear){cuts.push(f);noise(.15,.25,1200)}
    else{const left=guides.filter(g=>!cuts.used.includes(g));let g=left[0];left.forEach(x=>{if(Math.abs(x-f)<Math.abs(g-f))g=x});
      cuts.used.push(g);const off=Math.abs(g-f)>.07;if(off){bara++;toast('ずれちゃった！ 点線に あわせると 大きさが そろうよ','ng')}
      cuts.push(off?f:g);noise(.07,.35,900);const k=document.createElement('div');k.className='knife';k.textContent='🔪';k.style.left=(r.left-st.getBoundingClientRect().left+(off?f:g)*r.width)+'px';k.style.top='40%';st.appendChild(k);setTimeout(()=>k.remove(),400)}
    draw();upd();
    if(cuts.length>=need){done=true;if(bara>=2)G.miss++;sOK();cur.style.display='none';
      say(tear?'ちぎれた！':(bara>=2?'切れた！ つぎは 大きさを そろえよう':'きれいに 切れた！ 大きさも そろったね'),s.after||(tear?'レタスは 手で ちぎると、切り口が 茶色く なりにくいよ':''));
      $('ctrl').innerHTML='';nextBtn()}}};

/* ---------- はかる（けいりょうカップ） ---------- */
STEP.measure=s=>{const st=$('stage');st.className='stage plain';const max=s.max,tgt=s.target,tol=s.tol||max*.05;let v=0,pour=0,done=false;
  say(s.q,s.sub||'「そそぐ」を おしている あいだ 入るよ。目もりは 目の 高さで 見よう','📏');
  const col=s.col||'#8FD0FF';
  st.innerHTML=`<div class="kit"><svg viewBox="0 0 400 300">
    <rect x="0" y="260" width="400" height="40" fill="#C98B4E"/>
    <path d="M140 40 L260 40 L252 262 L148 262 Z" fill="#fff" fill-opacity=".55" stroke="#8AA6B8" stroke-width="4"/>
    <clipPath id="cc"><path d="M142 42 L258 42 L250 260 L150 260 Z"/></clipPath>
    <rect id="liq" x="130" y="260" width="140" height="0" fill="${col}" clip-path="url(#cc)"/>

  const liq=st.querySelector('#liq'),stream=st.querySelector('#stream');stream.style.display='none';

STEP.togu=s=>{const st=$('stage');st.className='stage sink';let round=0,cloud=0,dist=0,state='rub';const R=3,need=1800;

STEP.heat=s=>{const st=$('stage');st.className='stage';st.style.background='';const v=VES[s.ves];

     <rect x="${v.cx+v.rx-8}" y="${v.cy-8}" width="92" height="16" rx="8" fill="#222" transform="rotate(-6 ${v.cx+v.rx} ${v.cy})"/>

  const $s=q=>st.querySelector(q),cur=$s('.cur');

  function drawFire(){const n={off:0,low:1,mid:2,high:3}[H.fire];let g='';
    if(n){const h=[0,10,20,32][n];for(let i=-5;i<=5;i++){const x=i*16;g+=`<path class="flm" style="animation-delay:${(i+5)*.03}s" d="M${x-6} 0 Q${x} ${-h*1.4} ${x+6} 0 Z" fill="#3D8BFF" opacity=".9"/><path class="flm" d="M${x-3} 0 Q${x} ${-h*.8} ${x+3} 0 Z" fill="#BFE0FF"/>`}}

    $('ctrl').querySelectorAll('.fire button').forEach(b=>b.classList.toggle('on',b.dataset.l===H.fire))}

      const c={k,el,age:0,flat:k==='tamago'&&s.ves==='furaipan'};place(c,!c.flat);if(c.flat){const[px,py]=pct(v.cx,v.cy+2);el.style.left=px+'%';el.style.top=py+'%'}st.appendChild(el);H.chunks.push(c)}

    const x=v.cx+Math.cos(a)*v.rx*r,y=v.cy+Math.sin(a)*v.ry*r;const[px,py]=pct(x,y);c.el.style.left=px+'%';c.el.style.top=py+'%';if(first)c.el.style.transform=`translate(-50%,-50%) rotate(${rnd(0,360)|0}deg)`}
  /* コントロール */

  const ph=()=>s.ph[H.ph];

  function adv(){H.ph++;H.stirD=0;H.boilT=0;if(H.ph>=s.ph.length){done();return}showPhase()}
  function showPhase(){const p=ph();const bar=$('hbar');bar.hidden=true;$('tstop').hidden=true;

  $('fanb').onclick=()=>{if(G.fan){toast('りょうりが おわるまで つけて おこう');return}sTap();G.fan=true;drawFan();if(ph()&&ph()[0]==='fan')adv()};
  c.querySelectorAll('.fire button').forEach(b=>b.onclick=()=>{const l=b.dataset.l,p=ph();if(!p)return;

  var name=(document.title.split('｜')[0]||'').trim();
  var text=name?'「'+name+'」で あそんだよ！ #あたやさいさいゲームランド':'あたやさいさいゲームランドで あそんだよ！ #あたやさいさいゲームランド';
  var e=encodeURIComponent;
  box.querySelector('[data-s=x]').href='https://x.com/intent/post?text='+e(text)+'&url='+e(url);
  box.querySelector('[data-s=line]').href='https://social-plugins.line.me/lineit/share?url='+e(url);
  box.querySelector('[data-s=fb]').href='https://www.facebook.com/sharer/sharer.php?u='+e(url);
  var msg=box.querySelector('.gl-msg');
  function say(t){msg.textContent=t;msg.hidden=false}
  box.querySelector('[data-s=more]').addEventListener('click',function(){
    if(navigator.share){navigator.share({title:name,text:text,url:url}).catch(function(){});return}
    var all=text+'\n'+url;
    if(navigator.clipboard){navigator.clipboard.writeText(all).then(function(){say('コピーしたよ！ インスタなどに はりつけてね')},function(){say(url)})}
    else say(url);
  });
  var home=document.getElementById('title')||document.getElementById('s-title');
  if(home) home.appendChild(box);
  box.hidden=false;
})();
</script>
<!-- /gl-share -->
</body>
</html>
