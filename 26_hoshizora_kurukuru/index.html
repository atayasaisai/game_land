<style>
:root{
  --bg0:#05070F;
  --ink:#EAF0FF; --sub:#9AA6C4; --faint:#5C6B8A;
  --line:rgba(255,255,255,.12);
  --panel:rgba(255,255,255,.055);
  --ok:#4CD9A0; --ng:#FF7A6B;
  color-scheme:dark;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  margin:0;font-family:"Zen Kaku Gothic New",-apple-system,BlinkMacSystemFont,"Hiragino Sans",sans-serif;
  color:var(--ink);background:var(--bg0);line-height:1.8;overflow-x:hidden;
  -webkit-font-smoothing:antialiased;
}
#sky{position:fixed;inset:0;z-index:0;pointer-events:none;
  background:
    radial-gradient(1200px 800px at 50% -10%, #1E2A57 0%, transparent 60%),
    radial-gradient(900px 700px at 85% 100%, #2A1840 0%, transparent 62%),
    radial-gradient(800px 600px at 8% 80%, #0C2B41 0%, transparent 60%),
    linear-gradient(180deg,#070B18 0%,#05070F 100%);
}
.wrap{position:relative;z-index:1;max-width:620px;margin:0 auto;padding:0 16px calc(24px + env(safe-area-inset-bottom))}
button{font-family:inherit;color:inherit;cursor:pointer}

/* ---------- buttons ---------- */
.btn{
  border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.07);
  color:var(--ink);font-weight:700;font-size:1rem;padding:13px 26px;border-radius:14px;
  letter-spacing:.04em;white-space:nowrap;transition:transform .12s ease, background .2s, border-color .2s;
}
.btn:hover{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.3)}
.btn:active{transform:scale(.96)}
.btn.pri{
  background:linear-gradient(140deg,#4D7BFF,#8A5BFF 60%,#C24BFF);
  border-color:rgba(255,255,255,.34);color:#fff;
  box-shadow:0 8px 30px -8px rgba(110,90,255,.85), inset 0 1px 0 rgba(255,255,255,.4);
}
.btn.go{
  font-size:1.06rem;font-weight:900;padding:15px 10px;width:100%;
  background:linear-gradient(140deg,#00C2A8,#00A4E0 55%,#3D7BFF);
  border-color:rgba(255,255,255,.34);
  box-shadow:0 10px 32px -10px rgba(0,180,220,.95), inset 0 1px 0 rgba(255,255,255,.45);
}
.btn.sm{font-size:.82rem;padding:7px 12px;border-radius:11px;font-weight:500}
.btn.on{background:rgba(111,227,255,.18);border-color:rgba(111,227,255,.6);color:#fff}

/* ---------- title（トップと同じ空の絵＋木の看板のロゴ。中身は夜空の板にのせる） ---------- */
#title{position:relative;z-index:1;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:6px;padding:24px 16px 40px;
  background:#bfe3f5 url(bg.jpg) center 30%/cover no-repeat}
.tlead{display:inline-block;font-size:.72rem;letter-spacing:.2em;border:2.5px solid #33312A;border-radius:999px;padding:3px 15px;
  background:#fff;color:#33312A;box-shadow:3px 3px 0 #33312A;text-decoration:none;font-weight:700}
.logo{position:relative;display:flex;align-items:center;justify-content:center;gap:4px;margin:26px auto 0;max-width:640px}
.logo .side{width:clamp(56px,16vw,110px);height:auto;flex:none;filter:drop-shadow(0 4px 4px rgba(0,0,0,.25));animation:hop 1.6s ease-in-out infinite}
.logo .side.r{animation-delay:-.8s}
@keyframes hop{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-10px) rotate(3deg)}}
.sign{position:relative;padding:20px clamp(12px,4vw,30px) 18px;border-radius:26px;line-height:1.1;
  background:linear-gradient(#c98a4b,#a86a33 55%,#8d5528);border:4px solid #5b3417;
  box-shadow:inset 0 3px 0 rgba(255,255,255,.35),inset 0 -5px 0 rgba(0,0,0,.18),0 8px 0 #5b3417,0 14px 22px rgba(40,30,10,.35);
  animation:swing 3.2s ease-in-out infinite;transform-origin:50% 0}
@keyframes swing{0%,100%{transform:rotate(-1.2deg)}50%{transform:rotate(1.2deg)}}
.sign .crown{position:absolute;left:50%;top:-32px;width:58px;transform:translateX(-50%) rotate(-4deg);filter:drop-shadow(0 3px 0 #5b3417)}
.sign .star{position:absolute;font-size:1.3rem;color:#ffd43b;text-shadow:0 2px 0 #7a4a12;animation:twk 1.4s ease-in-out infinite}
.sign .star.a{left:8px;top:6px}.sign .star.b{right:10px;bottom:4px;animation-delay:-.7s}
@keyframes twk{0%,100%{transform:scale(1)}50%{transform:scale(1.35) rotate(15deg)}}
.logo h1{font-family:"Mochiy Pop One",sans-serif;font-weight:400;line-height:1.1;letter-spacing:0;margin:0;font-size:1rem}
.logo h1 .sm{display:block;font-size:clamp(.8rem,3.2vw,1.15rem);color:#fff;letter-spacing:.2em;
  text-shadow:0 2px 0 #5b3417,2px 0 0 #5b3417,-2px 0 0 #5b3417,0 -2px 0 #5b3417;margin-bottom:4px}
.logo h1 .bg,.logo h1 .q{display:block;white-space:nowrap}
.logo h1 .lt{display:inline-block;font-size:min(4.4rem,11vw,calc(46vw / var(--n,2)),calc(17rem / var(--n,2)));color:var(--k);
  text-shadow:3px 0 0 #fff,-3px 0 0 #fff,0 3px 0 #fff,0 -3px 0 #fff,2px 2px 0 #fff,-2px -2px 0 #fff,2px -2px 0 #fff,-2px 2px 0 #fff,
    0 7px 0 #5b3417,4px 5px 0 #5b3417,-4px 5px 0 #5b3417;
  transform:rotate(var(--r,0deg));animation:jump 2.4s ease-in-out infinite;animation-delay:calc(var(--i) * .12s)}
.logo h1 .q{margin-top:4px}
.logo h1 .q .lt{font-size:clamp(1.5rem,6.6vw,2.6rem);color:#ffd84d;
  text-shadow:3px 0 0 #7a3f12,-3px 0 0 #7a3f12,0 3px 0 #7a3f12,0 -3px 0 #7a3f12,2px 2px 0 #7a3f12,-2px -2px 0 #7a3f12,2px -2px 0 #7a3f12,-2px 2px 0 #7a3f12,0 6px 0 #3e1f08}
@keyframes jump{0%,78%,100%{transform:translateY(0) rotate(var(--r,0deg))}86%{transform:translateY(-9px) rotate(var(--r,0deg))}}
.tpanel{margin-top:22px;width:100%;max-width:520px;display:flex;flex-direction:column;align-items:center;gap:6px;
  background:linear-gradient(165deg,rgba(20,28,58,.93),rgba(8,11,26,.95));border:3px solid #2a3560;border-radius:28px;
  padding:18px 16px 22px;box-shadow:0 10px 30px rgba(10,20,50,.45)}
.kicker{font-size:.7rem;letter-spacing:.42em;color:var(--sub);text-transform:uppercase;margin:0 0 0 .42em}
.tpanel p{max-width:26em;color:var(--sub);font-size:.9rem;margin:10px 0 4px;text-wrap:balance}
.tpanel p b{color:var(--ink);font-weight:700}
.tbtns{display:flex;flex-direction:column;gap:9px;margin-top:16px;width:100%;max-width:340px}
.stg{display:flex;align-items:center;gap:12px;text-align:left;width:100%;
  border:1px solid var(--line);border-radius:14px;padding:10px 14px;background:rgba(255,255,255,.04);transition:.15s}
.stg:hover{border-color:rgba(120,180,255,.5);background:rgba(80,140,255,.1)}
.stg .n{font-family:"Mochiy Pop One",sans-serif;font-size:1.2rem;color:#8FC5FF;min-width:1.4em;text-align:center}
.stg b{display:block;font-size:.95rem}
.stg small{display:block;font-size:.72rem;color:var(--sub);line-height:1.5}
.stg .rec{margin-left:auto;color:#ffd43b;font-size:.9rem;letter-spacing:.05em;white-space:nowrap}
.stg .rec i{color:#3a4668;font-style:normal}
.backlink{display:inline-block;margin-top:22px;font-size:.82rem;letter-spacing:.06em;color:var(--sub);
  text-decoration:none;border:1px solid rgba(255,255,255,.22);border-radius:999px;padding:6px 18px;transition:.15s}
.backlink:hover{color:#fff;border-color:rgba(255,255,255,.5);background:rgba(255,255,255,.06)}
.grade{font-size:.72rem;color:var(--faint);margin-top:10px}

/* ---------- 共通の画面 ---------- */
.scr{display:none;padding-top:14px}
.hud{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:10px}
.hud h2{font-size:1rem;margin:0;font-weight:900;letter-spacing:.06em}
.hudR{display:flex;align-items:baseline;gap:10px;font-variant-numeric:tabular-nums}
.prog{font-size:.78rem;color:var(--sub);letter-spacing:.08em}
.score{font-size:1.3rem;font-weight:900}
.score small{font-size:.6rem;color:var(--sub);font-weight:500;letter-spacing:.15em;margin-left:2px}
.bar{height:5px;border-radius:99px;background:rgba(255,255,255,.08);overflow:hidden;margin-bottom:12px}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#00C2A8,#3D7BFF);transition:width .3s}
.card{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:10px;margin-bottom:12px}
.cvw{position:relative}
canvas.sky{display:block;width:100%;border-radius:12px;touch-action:pan-y;user-select:none;-webkit-user-select:none}
#labCv{cursor:grab}
.when{display:flex;align-items:baseline;justify-content:center;gap:12px;flex-wrap:wrap;margin:2px 0 6px;font-weight:900;font-size:1.05rem}
.when small{font-size:.78rem;color:var(--sub);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin-top:8px}
.row .lab{font-size:.72rem;color:var(--sub);align-self:center;margin-right:2px}
.sl{display:flex;align-items:center;gap:10px;margin-top:8px;font-size:.78rem;color:var(--sub)}
.sl span{min-width:4.4em}
input[type=range]{flex:1;accent-color:#6FE3FF}
.note{font-size:.76rem;color:var(--sub);text-align:center;margin:6px 0 0}
.chips{display:flex;flex-wrap:wrap;gap:5px;margin-top:6px}
.chips span{font-size:.74rem;border:1px solid rgba(255,214,90,.35);color:#ffe7a0;border-radius:99px;padding:1px 10px;background:rgba(255,214,90,.06)}
.hintbox{font-size:.84rem;background:rgba(111,227,255,.07);border:1px solid rgba(111,227,255,.25);border-radius:12px;padding:8px 12px;margin-top:8px}
.hintbox b{color:#fff}

/* ---------- クイズ ---------- */
.qtext{font-size:1.02rem;font-weight:700;text-align:center;margin:4px 0 8px;text-wrap:balance}
.chs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chs.two{grid-template-columns:repeat(2,1fr)}
.ch{padding:12px 4px;border-radius:14px;font-weight:900;font-size:1rem;
  border:2px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);transition:.15s}
.ch:hover{border-color:rgba(255,255,255,.4)}
.ch.ok{border-color:var(--ok);background:rgba(76,217,160,.16)}
.ch.ng{border-color:var(--ng);background:rgba(255,122,107,.14)}
.ch:disabled{cursor:default}
.fb{display:none;margin-top:12px;border-radius:16px;padding:12px 14px;border:1px solid var(--line);background:rgba(255,255,255,.06)}
.fb.on{display:block;animation:pop .25s ease}
@keyframes pop{from{transform:scale(.96);opacity:0}to{transform:none;opacity:1}}
.fb .mk{font-size:1.2rem;font-weight:900}
.fb.ok .mk{color:var(--ok)} .fb.ng .mk{color:var(--ng)}
.fb p{margin:4px 0 0;font-size:.88rem}
.fb .btn{margin-top:10px;width:100%}

/* ---------- 結果 ---------- */
.ov{position:fixed;inset:0;z-index:10;display:none;align-items:center;justify-content:center;padding:20px;background:rgba(3,5,14,.72)}
.ov.on{display:flex}
.ovc{width:100%;max-width:380px;text-align:center;background:linear-gradient(165deg,#18204a,#0a0e22);border:2px solid #2a3560;border-radius:24px;padding:24px 20px}
.ovc .big{font-size:2.4rem;color:#ffd43b;letter-spacing:.1em}
.ovc .big i{color:#34405e;font-style:normal}
.ovc h3{margin:6px 0;font-size:1.2rem}
.ovc p{color:var(--sub);font-size:.9rem;margin:4px 0 16px}
.ovc .row .btn{flex:1}
@media (max-width:380px){.chs{grid-template-columns:repeat(2,1fr)}}
</style>

<section id="title">

/* ---------- 空の 計算 ----------
   場所は 北緯35度・東経135度（日本の まん中あたり。東経135度なので 時計の時こくが そのまま使える）。 */
var LAT=35*RAD, SINL=Math.sin(LAT), COSL=Math.cos(LAT);
function lst(doy,T){return mod(T-12+(doy-79)*24/365.2422,24);}          // 恒星時（時）
function altaz(ra,dec,L){                                                  // → [高度, 方位（北0・東90）]
  var H=(L-ra)*15*RAD, d=dec*RAD;
  var alt=Math.asin(SINL*Math.sin(d)+COSL*Math.cos(d)*Math.cos(H));
  var az=Math.atan2(-Math.cos(d)*Math.sin(H), Math.sin(d)*COSL-Math.cos(d)*Math.cos(H)*SINL);
  return [alt/RAD, mod(az/RAD,360)];
}
function sunRaDec(doy){var l=(doy-80)*360/365.2422*RAD, e=23.44*RAD;
  return [mod(Math.atan2(Math.cos(e)*Math.sin(l),Math.cos(l))/RAD/15,24), Math.asin(Math.sin(e)*Math.sin(l))/RAD];}

/* 見る方角の 絵（地平線が下、見上げた空が上。魚眼レンズのように 少し ゆがめて 広く 見せる）と、まうえ（頭の上が まん中） */
var VIEWS={N:0,E:90,S:180,W:270}, H0=32*RAD;
var VNAME={N:"北",E:"東",S:"南",W:"西",Z:"まうえ"};
function projector(view,W,H){
  if(view==="Z"){var R=W/2-26,cx=W/2,cy=H/2;
    return {dome:true,R:R,cx:cx,cy:cy,p:function(alt,az){if(alt<-0.5)return null;var r=R*(90-alt)/90,a=az*RAD;return [cx-r*Math.sin(a),cy-r*Math.cos(a)];}};}
  var A0=VIEWS[view], s=W/2.53, cy=s*1.15;
  return {A0:A0,s:s,cy:cy,p:function(alt,az){
    var h=alt*RAD, dA=(mod(az-A0+180,360)-180)*RAD;
    var cc=Math.sin(H0)*Math.sin(h)+Math.cos(H0)*Math.cos(h)*Math.cos(dA);
    if(cc<-0.2)return null;
    var k=2/(1+cc), x=W/2+s*k*Math.cos(h)*Math.sin(dA), y=cy-s*k*(Math.cos(H0)*Math.sin(h)-Math.sin(H0)*Math.cos(h)*Math.cos(dA));
    if(x<-80||x>W+80||y<-80||y>H+80)return null;
    return [x,y];}};
}

  [16,8,0].forEach(function(sh){var x=Math.round(((a>>sh)&255)*(1-t)+((b>>sh)&255)*t);r+=("0"+x.toString(16)).slice(-2);});return r;}
function skyCols(sa){
  var N=["#03061a","#0e1a3c"],D=["#1c2f6b","#e0905a"],Y=["#3d8fd6","#bfe3ff"];
  if(sa<=-12)return N; if(sa>=8)return Y;
  if(sa<0){var t=(sa+12)/12;return [mix(N[0],D[0],t),mix(N[1],D[1],t)];}

  if(cv.width!==Math.round(w*d)||cv.height!==Math.round(h*d)){cv.width=Math.round(w*d);cv.height=Math.round(h*d);}

  // 星
  for(var sid in pos){var p=pos[sid].xy;if(!p)continue;var m=ST[sid][2],r=Math.max(0.9,3.5-0.62*m)*k,cc=SCOL[ST[sid][3]]||"#ffffff";

    c.globalAlpha=sAlpha;c.fillStyle=cc;c.beginPath();c.arc(p[0],p[1],r,0,7);c.fill();}
  c.globalAlpha=1;
  // 名前
  var fs=Math.round(Math.max(10,11*k));
  if(st.names){
    // 右はしに 近い 名前は、星の 左がわに 書く

    c.textBaseline="alphabetic";

    CON.forEach(function(cn){var p=pos[cn.lb].xy;if(p&&pos[cn.lb].alt>1)label(cn.nm,p[0],p[1]-7);});
    c.font="500 "+(fs-1)+"px 'Zen Kaku Gothic New',sans-serif";c.fillStyle="rgba(210,225,255,"+(0.85*Math.max(sAlpha,0.5))+")";

  }
  // 太陽
  if(sa>-4){var sp=P.p(sa,sAA[1]);if(sp){var sg2=c.createRadialGradient(sp[0],sp[1],0,sp[0],sp[1],40*k);
    sg2.addColorStop(0,"#fff6c8");sg2.addColorStop(.25,"#ffd34d");sg2.addColorStop(1,"rgba(255,160,40,0)");
    c.fillStyle=sg2;c.beginPath();c.arc(sp[0],sp[1],40*k,0,7);c.fill();}}
  // 地面と 方角
  var DIRS=[["北",0],["北東",45],["東",90],["南東",135],["南",180],["南西",225],["西",270],["北西",315]];
  if(P.dome){
    c.restore();
    c.strokeStyle="rgba(255,255,255,.35)";c.lineWidth=2;c.beginPath();c.arc(P.cx,P.cy,P.R,0,7);c.stroke();
    c.textAlign="center";c.textBaseline="middle";
    DIRS.forEach(function(d){var a=d[1]*RAD,x=P.cx-(P.R+13)*Math.sin(a),y=P.cy-(P.R+13)*Math.cos(a);
      c.font=(d[0].length>1?"500 11px":"900 14px")+" 'Zen Kaku Gothic New',sans-serif";c.fillStyle=d[0].length>1?"#8fa3c8":"#e6efff";c.fillText(d[0],x,y);});
  }else{
    var hz=[];for(var da=-110;da<=110;da+=2){var hp=P.p(0,P.A0+da);if(hp)hz.push(hp);}

    c.fillStyle=gg;c.beginPath();c.moveTo(hz[0][0],H+2);hz.forEach(function(q){c.lineTo(q[0],q[1]);});c.lineTo(hz[hz.length-1][0],H+2);c.closePath();c.fill();
    c.strokeStyle="rgba(170,220,180,.35)";c.lineWidth=1;c.beginPath();hz.forEach(function(q,i){if(i)c.lineTo(q[0],q[1]);else c.moveTo(q[0],q[1]);});c.stroke();
    c.textAlign="center";c.textBaseline="top";
    DIRS.forEach(function(d){var dq=P.p(0,d[1]);if(!dq||dq[0]<14||dq[0]>W-14)return;
      c.font=(d[0].length>1?"500 12px":"900 16px")+" 'Zen Kaku Gothic New',sans-serif";c.fillStyle=d[0].length>1?"#8fb59a":"#d8f5e0";c.fillText(d[0],dq[0],dq[1]+6);});
  }

    var L2=lst(st.doy,st.T+gh.off), gp={}, cn=CONID[gh.con], sx=0, sy=0, n=0;
    cn.stars.forEach(function(id){var s=ST[id],aa=altaz(s[0],s[1],L2),q=P.p(aa[0],aa[1]);gp[id]=q;if(q){sx+=q[0];sy+=q[1];n++;}});
    c.strokeStyle=gh.col;c.lineWidth=2.4*k;c.setLineDash([5,4]);
    cn.seg.forEach(function(sg){var p=gp[sg[0]],q=gp[sg[1]];if(p&&q){c.beginPath();c.moveTo(p[0],p[1]);c.lineTo(q[0],q[1]);c.stroke();}});

    if(n)badge(c,sx/n,sy/n,gh.lb,gh.bg||"rgba(40,60,120,.9)");});}
  if(st.ring&&pos[st.ring].xy){var rp=pos[st.ring].xy;

    if(st.arrows)st.arrows.forEach(function(ar){var x2=rp[0]+Math.cos(ar.a)*56,y2=rp[1]+Math.sin(ar.a)*56;

  if(sa>0&&!st.quiet){c.textAlign="center";c.textBaseline="top";c.font="700 12px 'Zen Kaku Gothic New',sans-serif";

function timeLabel(T){
  T=mod(T,24);var h=Math.floor(T),m=Math.round((T-h)*60);if(m===60){h=(h+1)%24;m=0;}
  var w=T<4?"まよなか":T<7?"あけがた":T<10?"あさ":T<15?"ひる":T<17?"ゆうがた":T<19?"ゆうがた":T<23?"よる":"まよなか";
  var hh=h===0?"よる12時":h<12?"ごぜん"+h+"時":h===12?"ひる12時":"ごご"+(h-12)+"時";
  return hh+(m?m+"分":"")+" <small>"+w+"</small>";
}

function conOK(con,doy,T,minAlt,maxAlt){var L=lst(doy,T);return CONID[con].stars.every(function(id){var h=altaz(ST[id][0],ST[id][1],L)[0];return h>=minAlt&&h<=(maxAlt||90);});}

/* 1 北の空：何時間後に どこ？ */
function genNorth(i){
  var con=i%2?"cas":"hokuto";
  for(var t=0;t<600;t++){
    // 3時間なら 45度、4時間なら 60度ずつ 北極星の まわりに ちらばる。
    // いまの 形と こたえは 地平線の 上に、ほかの こたえは 地平線の 少し下まで ゆるす（地面の 上に 点線で かく）
    var d=[3,4][rnd(2)], doy=1+rnd(365), T=NIGHT[rnd(NIGHT.length)], offs=[d,-d,2*d,-2*d];
    if(conOK(con,doy,T,5)&&conOK(con,doy,T+d,5)&&[-d,2*d,-2*d].every(function(o){return conOK(con,doy,T+o,-8);}))return {con:con,d:d,doy:doy,T:T,offs:shuffle(offs)};
  }
  return {con:"cas",d:3,doy:20,T:21,offs:shuffle([3,-3,6,-6])};
}
/* 2 東・南・西：この星は どっちへ？ */
var BRIGHT=["sirius","betelgeuse","rigel","procyon","aldebaran","capella","pollux","regulus","spica","arcturus","antares","vega","altair","deneb","fomalhaut","alphard","hamal"];
function genDir(i){
  var view=["E","S","W"][i%3];
  for(var t=0;t<800;t++){
    var doy=1+rnd(365), T=NIGHT[rnd(NIGHT.length)], id=BRIGHT[rnd(BRIGHT.length)];
    var L=lst(doy,T), aa=altaz(ST[id][0],ST[id][1],L), dA=mod(aa[1]-VIEWS[view]+180,360)-180;
    var su=sunRaDec(doy);if(altaz(su[0],su[1],L)[0]>-12)continue;
    if(aa[0]>14&&aa[0]<50&&Math.abs(dA)<35)return {view:view,doy:doy,T:T,star:id};
  }
  return {view:"S",doy:20,T:21,star:"sirius"};
}
/* 3 季節：この星座は？／この空は いつ？ */
function genSeason(i){
  if(i%3===2){var s=rnd(4);return {kind:"when",s:s,doy:SEASON_DOY[s],T:21,view:"S"};}
  for(var t=0;t<200;t++){
    var s2=rnd(4), doy=SEASON_DOY[s2], pool=CON.filter(function(cn){return cn.s===s2&&conOK(cn.id,doy,21,15);});
    if(!pool.length)continue;
    var cn=pool[rnd(pool.length)], others=shuffle(CON.filter(function(x){return x.id!==cn.id&&x.id!=="umi";})).slice(0,3);
    return {kind:"con",s:s2,doy:doy,T:21,view:"Z",con:cn.id,ch:shuffle([cn].concat(others)).map(function(x){return x.id;})};
  }
}
var STAGES=[
  {nm:"北の空",make:function(){var a=[];for(var i=0;i<8;i++)a.push(genNorth(i));return a;}},
  {nm:"東・南・西の空",make:function(){var a=[];for(var i=0;i<9;i++)a.push(genDir(i));return shuffle(a).slice(0,8);}},
  {nm:"季節の 星座",make:function(){var a=[],used={};
    for(var i=0;i<8;i++){var q;do{q=genSeason(i);}while(q.kind==="con"&&used[q.con]);if(q.con)used[q.con]=1;a.push(q);}
    return a;}}
];

function animateT(from,to,ms,after){
  var t0=0;
  function f(ts){if(!t0)t0=ts;var u=Math.min(1,(ts-t0)/ms);u=u<.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    Q.dr.T=from+(to-from)*u;redrawQ();if(u<1)anim=requestAnimationFrame(f);else{anim=0;if(after)after();}}
  anim=requestAnimationFrame(f);
}

    var how={E:"東の 空の 星は、<b>右ななめ上へ のぼって</b> いく。",S:"南の 空の 星は、<b>東（左）から 西（右）へ</b> 動く。",W:"西の 空の 星は、<b>右ななめ下へ しずんで</b> いく。"}[q.view];
    body='<p>こたえは <b>'+LB[right]+'</b>。'+how+'</p><p style="color:var(--sub)">星は 太陽と 同じように、東から のぼって 南の 空を 通り、西へ しずむ。地球が 1日に 1回 回っているから。</p>';
  }else{

      right=q.ch.indexOf(q.con);ok=i===right;
      Q.dr.names=true;redrawQ();
      body='<p>こたえは <b>'+CONID[q.con].nm+'</b>。'+CONID[q.con].tip+'</p>';
    }else{
      right=q.s;ok=i===right;
      Q.dr.names=true;redrawQ();
      $("#qWhen").innerHTML=dateLabel(q.doy)+"　"+timeLabel(q.T);
      body='<p>こたえは <b>'+SEASON[q.s]+'</b>。'+SEASON[q.s]+'の よる9時ごろ、南の 空には '+SEASON_SOUTH[q.s]+'が 見える。</p><p style="color:var(--sub)">同じ 時こくでも、季節が かわると 見える 星座が かわる。地球が 太陽の まわりを 1年で 回っているから。</p>';
    }
  }
  $$("#qChoices .ch").forEach(function(b,k){b.disabled=true;if(k===right)b.classList.add("ok");else if(k===i)b.classList.add("ng");});
  if(ok)Q.score++;
  $("#qScore").innerHTML=Q.score+"<small>てん</small>";
  $("#fbMk").textContent=ok?"◎ せいかい！":"✕ おしい！";
  $("#fbBody").innerHTML=body;
  $("#nextBtn").textContent=Q.i+1<Q.qs.length?"つぎへ ▶":"けっかを 見る ▶";
  $("#fb").className="fb on "+(ok?"ok":"ng");
  setTimeout(function(){$("#fb").scrollIntoView({behavior:"smooth",block:"nearest"});},60);
}
$("#nextBtn").addEventListener("click",function(){
  Q.i++;
  if(Q.i<Q.qs.length){ask();window.scrollTo({top:0,behavior:"smooth"});return;}
  if(anim){cancelAnimationFrame(anim);anim=0;}
  $("#qBar").style.width="100%";
  var n=Q.qs.length, stars=Q.score===n?3:Q.score>=n*0.75?2:Q.score>0?1:0;
  if(stars>(rec[Q.st]||0)){rec[Q.st]=stars;save("hoshizora_kurukuru_rec",rec);}
  $("#rStars").innerHTML=starStr(stars);
  $("#rTitle").textContent=stars===3?"パーフェクト！":stars===2?"よく できました！":"また ちょうせんしよう！";
  $("#rText").textContent=n+"もん中 "+Q.score+"もん せいかい"+(stars<3?"。「空を まわす」で 星を 動かしてから、もういちど やってみよう。":"。");
  $("#resultOv").classList.add("on");
});
$("#rAgain").addEventListener("click",function(){$("#resultOv").classList.remove("on");startStage(Q.st);});
$("#rTitleBtn").addEventListener("click",function(){$("#resultOv").classList.remove("on");show("title");paintRec();});
$("#quizBack").addEventListener("click",function(){
  if(Q.i>0&&!confirm("とちゅうで やめて、タイトルに もどる？"))return;
  if(anim){cancelAnimationFrame(anim);anim=0;}
  show("title");paintRec();
});
$$(".stg").forEach(function(b){b.addEventListener("click",function(){startStage(+b.dataset.st);});});

paintRec();
})();
</script>
</body>
</html>
